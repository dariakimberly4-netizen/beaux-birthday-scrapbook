<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08010b"><title>Queen B — 100 Memories</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070109;color:#fff;font-family:Arial,sans-serif}.scene{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#4b145d 0,#24072e 31%,#100316 62%,#050007 100%);isolation:isolate}.scene:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 20deg,transparent,rgba(244,213,127,.06),transparent 22%,rgba(111,40,139,.08),transparent 55%);animation:spin 22s linear infinite;z-index:-2}@keyframes spin{to{transform:rotate(360deg)}}.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe69c;box-shadow:0 0 12px #ffd86e;animation:twinkle 2.4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.18;transform:scale(.45)}}.content{text-align:center;width:min(92vw,720px);padding:24px;position:relative;z-index:4}.tiny{font-size:10px;font-weight:800;letter-spacing:.42em;color:#d9b96f;text-transform:uppercase;opacity:0;animation:rise .9s ease .4s forwards}.crown{width:min(290px,62vw);margin:18px auto 7px;filter:drop-shadow(0 0 20px rgba(245,211,125,.4));opacity:0;transform:scale(.5);animation:crownIn 1.7s cubic-bezier(.16,.85,.3,1.1) .75s forwards}.crown svg{width:100%;overflow:visible}.crown path,.crown polygon,.crown rect{fill:url(#g);stroke:#fff0b5;stroke-width:1.1}.gem{fill:#7c2b91!important}.title{margin:0;font:500 clamp(48px,11vw,88px)/.9 Georgia,serif;letter-spacing:.06em;color:#fff8e8;opacity:0;animation:rise 1s ease 1.8s forwards}.title span{color:#f4d57f}.sub{margin:15px auto 27px;color:#d7cbd9;font:400 clamp(14px,3.6vw,18px)/1.5 Georgia,serif;letter-spacing:.04em;opacity:0;animation:rise 1s ease 2.15s forwards}.enter{min-width:210px;min-height:64px;border:1px solid #ffe9a7;border-radius:999px;background:linear-gradient(135deg,#fff0b8,#e0ae4e 52%,#a96620);color:#1b071d;font-weight:900;font-size:14px;letter-spacing:.23em;box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 35px rgba(235,185,65,.18);cursor:pointer;opacity:0;animation:rise 1s ease 2.5s forwards;touch-action:manipulation}.enter:active{transform:scale(.97)}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes crownIn{0%{opacity:0;transform:scale(.45) rotate(-4deg)}65%{opacity:1;transform:scale(1.07) rotate(2deg)}100%{opacity:1;transform:scale(1)}}.tiny,.title,.sub,.enter{transform:translateY(16px)}.flare{position:absolute;left:50%;top:43%;width:8px;height:8px;border-radius:50%;background:#fff4c5;box-shadow:0 0 30px 12px #f3c55e,0 0 90px 30px rgba(141,52,171,.55);transform:translate(-50%,-50%) scale(0);opacity:0}.scene.go .flare{animation:blast 1.05s ease-out forwards}@keyframes blast{35%{opacity:1;transform:translate(-50%,-50%) scale(2)}100%{opacity:0;transform:translate(-50%,-50%) scale(35)}}.scene.go .content{animation:leave .85s ease .15s forwards}@keyframes leave{to{transform:scale(1.16);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}.tiny,.crown,.title,.sub,.enter{opacity:1;transform:none}}</style></head><body><main class="scene" id="scene"><div class="stars" id="stars"></div><div class="flare"></div><section class="content"><div class="tiny">A birthday universe for</div><div class="crown" aria-hidden="true"><svg viewBox="0 0 420 250"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3bd"/><stop offset=".48" stop-color="#e1ad45"/><stop offset="1" stop-color="#8f541d"/></linearGradient></defs><polygon points="45,182 25,58 120,128 208,25 298,128 395,58 373,182"/><rect x="45" y="174" width="328" height="48" rx="18"/><circle class="gem" cx="208" cy="191" r="15"/><circle class="gem" cx="112" cy="191" r="9"/><circle class="gem" cx="304" cy="191" r="9"/></svg></div><h1 class="title">QUEEN <span>B</span></h1><p class="sub">100 memories. One unforgettable story.</p><button class="enter" id="enter">ENTER</button></section></main><script>const stars=document.getElementById('stars');for(let i=0;i<55;i++){const s=document.createElement('i');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*2.5)+'s';s.style.opacity=.25+Math.random()*.7;stars.appendChild(s)}let going=false;document.getElementById('enter').onclick=()=>{if(going)return;going=true;document.getElementById('scene').classList.add('go');setTimeout(()=>location.href='crown-100.html?from=opening',900)};</script></body></html>
