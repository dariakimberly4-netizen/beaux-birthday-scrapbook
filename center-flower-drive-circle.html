<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BEAUX — Circular Photo Flower Garden</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061009}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#061009}</style></head><body><iframe id="outer" src="center-flower-drive-fixed.html?v=5"></iframe><script>(function(){const outer=document.getElementById('outer');function apply(){try{const od=outer.contentDocument;if(!od)return;const inner=od.getElementById('page');if(!inner)return;const d=inner.contentDocument;if(!d)return;if(!d.getElementById('circle-photo-fix')){const s=d.createElement('style');s.id='circle-photo-fix';s.textContent=`#centerImg{width:180px!important;height:180px!important;border-radius:50%!important;object-fit:contain!important;object-position:center!important;background:#080b09!important;padding:6px!important}.mini{width:28px!important;height:28px!important;border-radius:50%!important;background:#08100b!important}.mini img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;background:#08100b!important}@media(max-width:700px){#centerImg{width:116px!important;height:116px!important;border-radius:50%!important;object-fit:contain!important}.mini{width:21px!important;height:21px!important;border-radius:50%!important}.mini img{object-fit:contain!important}}`;d.head.appendChild(s);} }catch(e){}}outer.addEventListener('load',()=>{apply();setTimeout(apply,400);setTimeout(apply,1200)});setInterval(apply,1500)})();</script></body></html>
