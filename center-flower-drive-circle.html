ient(circle,#fff9fb 0,#ffe8ee 62%,#f6ccd8 100%)!important}.mini{width:20px!important;height:20px!important}.secretFlower{width:48px;height:48px;margin:-24px}.secretFlower:before{top:51px;font-size:7px}.msgCard{padding:28px 20px}.msgCard h2{font-size:28px}.msgCard p{font-size:16px}}`;d.head.appendChild(s);}if(!d.getElementById('secretMessageFlower')){const f=d.createElement('div');f.id='secretMessageFlower';f.className='secretFlower';f.setAttribute('aria-label','A message for Beaux');f.innerHTML='<i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><b class="sc"></b>';const swarm=d.getElementById('swarm')||d.body;swarm.appendChild(f);const o=d.createElement('div');o.id='secretMessageOverlay';o.className='msgOverlay';o.innerHTML='<button class="msgClose" aria-label="Close">×</button><div class="msgCard"><div class="msgTag">A message from me</div><h2>Happy Birthday, Sis! 💗</h2><p>Even if we are apart, you’re always close to my heart.</p><p>Love you always.</p></div>';d.body.appendChild(o);f.addEventListener('click',e=>{e.stopPropagation();o.classList.add('show')});o.querySelector('.msgClose').onclick=()=>o.classList.remove('show');o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')});let t0=0;function move(ts){if(!t0)t0=ts;const t=ts-t0,mob=w.innerWidth<700,rx=mob?105:185,ry=mob?76:132,a=t*.00018+1.1,x=Math.cos(a)*rx,y=Math.sin(a)*ry;f.style.transform='translate('+x+'px,'+y+'px) rotate('+(Math.sin(t*.001)*6)+'deg)';w.requestAnimationFrame(move)}w.requestAnimationFrame(move);} }catch(e){}}outer.addEventListener('load',()=>{apply();setTimeout(apply,350);setTimeout(apply,1000)});setInterval(apply,1600)})();</script></body></html>
