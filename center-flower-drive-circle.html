<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BEAUX — Circular Photo Flower Garden</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061009}#garden{position:fixed;inset:0;width:100%;height:100%;border:0;background:#061009}.messageFab{position:fixed;right:18px;bottom:105px;z-index:99999;width:82px;height:82px;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 0 18px rgba(255,215,110,.95))}.messageFab .p{position:absolute;left:50%;top:50%;width:25px;height:37px;margin:-18.5px 0 0 -12.5px;border-radius:72% 72% 48% 48%;transform-origin:50% 88%;background:radial-gradient(circle at 42% 25%,#fffdf0 0,#ffe9a8 28%,#e8c15c 62%,#c99a2e 100%)}.messageFab .p:nth-child(1){transform:rotate(0) translateY(-17px)}.messageFab .p:nth-child(2){transform:rotate(60deg) translateY(-17px)}.messageFab .p:nth-child(3){transform:rotate(120deg) translateY(-17px)}.messageFab .p:nth-child(4){transform:rotate(180deg) translateY(-17px)}.messageFab .p:nth-child(5){transform:rotate(240deg) translateY(-17px)}.messageFab .p:nth-child(6){transform:rotate(300deg) translateY(-17px)}.messageFab .c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:27px;height:27px;border-radius:50%;background:radial-gradient(circle,#fff8d9,#ffd86e 58%,#d3a331);box-shadow:0 0 0 3px rgba(255,243,198,.8),0 0 18px rgba(255,215,110,.95);z-index:3}.messageFab .heart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;font-size:13px;color:#7c5317}.messageFab .label{position:absolute;left:50%;top:84px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:rgba(8,16,11,.94);border:1px solid rgba(217,175,107,.78);color:#ffe7ad;font:700 9px Arial,sans-serif;letter-spacing:1.2px;white-space:nowrap}.overlay{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.9);backdrop-filter:blur(10px)}.overlay.show{display:flex}.card{width:min(540px,90vw);padding:36px 26px;text-align:center;border-radius:30px;background:radial-gradient(circle at top,#263328 0,#0b120d 72%);border:1px solid rgba(217,175,107,.72);box-shadow:0 24px 90px #000;color:#f8e8c7}.tag{display:inline-block;padding:7px 13px;border-radius:999px;border:1px solid rgba(217,175,107,.5);font:700 11px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}.card h2{margin:0 0 14px;font:34px Georgia,serif}.card p{margin:8px 0;font:18px/1.6 Arial,sans-serif}.close{position:absolute;right:18px;top:18px;width:50px;height:50px;border-radius:50%;border:1px solid #d9af6b;background:#111;color:white;font-size:26px;cursor:pointer}@media(max-width:700px){.messageFab{right:16px;bottom:96px;width:72px;height:72px}.messageFab .p{width:22px;height:32px;margin:-16px 0 0 -11px}.messageFab .p:nth-child(1){transform:rotate(0) translateY(-15px)}.messageFab .p:nth-child(2){transform:rotate(60deg) translateY(-15px)}.messageFab .p:nth-child(3){transform:rotate(120deg) translateY(-15px)}.messageFab .p:nth-child(4){transform:rotate(180deg) translateY(-15px)}.messageFab .p:nth-child(5){transform:rotate(240deg) translateY(-15px)}.messageFab .p:nth-child(6){transform:rotate(300deg) translateY(-15px)}.messageFab .c{width:23px;height:23px}.messageFab .label{top:74px;font-size:8px}.card h2{font-size:28px}.card p{font-size:16px}}</style></head><body><iframe id="garden" src="center-flower-drive-fixed.html?v=6"></iframe><button id="msgBtn" class="messageFab" aria-label="Open birthday message"><i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i><b class="c"></b><span class="heart">❤</span><span class="label">MESSAGE</span></button><div id="msgOverlay" class="overlay"><button id="closeMsg" class="close">×</button><div class="card"><div class="tag">A message from me</div><h2>Happy Birthday, Sis! 💗</h2><p>Even if we are apart, you’re always close to my heart.</p><p>Love you always.</p></div></div><script>const g=document.getElementById('garden'),b=document.getElementById('msgBtn'),o=document.getElementById('msgOverlay'),c=document.getElementById('closeMsg');b.onclick=()=>o.classList.add('show');c.onclick=()=>o.classList.remove('show');o.onclick=e=>{if(e.target===o)o.classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')o.classList.remove('show')});function fix(){try{const od=g.contentDocument;if(!od)return;const inner=od.getElementById('page');if(!inner)return;const d=inner.contentDocument;if(!d)return;if(!d.getElementById('circleFixV13')){const s=d.createElement('style');s.id='circleFixV13';s.textContent=`#center{isolation:isolate}#centerBackdrop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:126px;height:126px;border-radius:50%;z-index:4;background-position:center;background-size:cover;filter:blur(7px) saturate(.9) brightness(.92);overflow:hidden;box-shadow:0 0 0 5px rgba(217,175,107,.82),0 14px 38px rgba(0,0,0,.34)}#centerBackdrop:after{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(255,235,241,.42);border:4px solid #f9d6df;box-sizing:border-box}#centerImg{width:108px!important;height:108px!important;border-radius:0!important;object-fit:contain!important;object-position:center!important;background:transparent!important;background-image:none!important;padding:0!important;border:0!important;box-shadow:none!important;z-index:6!important}.mini{width:20px!important;height:20px!important;border-radius:50%!important;overflow:hidden!important}.mini img{width:100%!important;height:100%!important;object-fit:contain!important;border-radius:50%!important}@media(min-width:701px){#centerBackdrop{width:180px;height:180px}#centerImg{width:154px!important;height:154px!important}}`;d.head.appendChild(s)}const center=d.getElementById('center'),img=d.getElementById('centerImg');if(center&&img){let back=d.getElementById('centerBackdrop');if(!back){back=d.createElement('div');back.id='centerBackdrop';center.insertBefore(back,img)}if(img.src)back.style.backgroundImage='url("'+img.src+'")'}const old=d.getElementById('secretMessageFlower');if(old)old.remove();const oldOverlay=d.getElementById('secretMessageOverlay');if(oldOverlay)oldOverlay.remove()}catch(e){}}g.addEventListener('load',()=>{fix();setTimeout(fix,500);setTimeout(fix,1400)});setInterval(fix,1200);</script></body></html>
