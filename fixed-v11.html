<h1>BEAUX</h1><div class="tiny">A tiny flower garden made from memories.</div>
<form id="f"><input id="pw" type="password" placeholder="PASSWORD" autocomplete="off"><button id="go" type="submit">ENTER</button></form><div id="err" class="error"></div>
</div></div>
<script>
const frame=document.getElementById('garden');
function openGarden(){document.getElementById('lock').style.display='none';frame.style.display='block';const tryUnlock=()=>{try{const d=frame.contentDocument;if(!d)return;const p=d.getElementById('pw'),b=d.getElementById('go');if(p&&b){p.value='BEAUX';b.click();}}catch(e){}};frame.addEventListener('load',()=>{setTimeout(tryUnlock,300);setTimeout(tryUnlock,1000);setTimeout(tryUnlock,2000)});tryUnlock();}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('pw').value.trim().toUpperCase()==='BEAUX'){openGarden()}else{document.getElementById('err').textContent='Password is BEAUX ✦';}});
</script></body></html>
