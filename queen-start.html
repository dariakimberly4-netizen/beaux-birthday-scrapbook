<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110319">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>B for Beaux</title>
<style>
:root{
  --bg0:#07020b;
  --bg1:#12051c;
  --bg2:#2d0a42;
  --violet:#5b1f78;
  --gold:#f5d581;
  --gold2:#c58d2f;
  --cream:#fff6df;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg0);color:#fff;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
.stage{
  position:fixed;inset:0;overflow:hidden;isolation:isolate;
  display:grid;place-items:center;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  background:
    radial-gradient(circle at 50% 30%,rgba(132,57,164,.36),transparent 29%),
    radial-gradient(ellipse at 50% 54%,#36104b 0%,#1b0828 42%,#0d0413 70%,#050108 100%);
}
.stage:before{
  content:"";position:absolute;inset:-15%;z-index:-3;
  background:conic-gradient(from 180deg at 50% 50%,transparent 0 12%,rgba(255,207,100,.055) 14% 18%,transparent 20% 46%,rgba(176,91,210,.07) 50% 57%,transparent 60% 100%);
  animation:drift 18s linear infinite;
}
.stage:after{
  content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 20%,transparent 78%,rgba(0,0,0,.34));
}
@keyframes drift{to{transform:rotate(360deg)}}
.shell{
  position:relative;width:min(1180px,96vw);height:min(900px,94dvh);
  display:grid;place-items:center;
}
.frame,.frame2{position:absolute;pointer-events:none}
.frame{inset:0;border:1px solid rgba(226,187,101,.48);border-radius:220px 220px 38px 38px/110px 110px 38px 38px;box-shadow:inset 0 0 80px rgba(0,0,0,.22)}
.frame2{inset:12px;border:1px solid rgba(255,228,157,.14);border-radius:208px 208px 30px 30px/100px 100px 30px 30px}
.ornament{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:min(410px,58vw);height:74px;display:flex;align-items:flex-start;justify-content:center}
.ornament:before,.ornament:after{content:"";height:1px;flex:1;margin-top:22px;background:linear-gradient(90deg,transparent,rgba(244,211,133,.7))}
.ornament:after{background:linear-gradient(90deg,rgba(244,211,133,.7),transparent)}
.jewel{width:13px;height:13px;margin:16px 15px 0;transform:rotate(45deg);border:1px solid var(--gold);box-shadow:0 0 18px rgba(255,209,103,.72);background:#26102f}
.content{position:relative;width:min(780px,90vw);text-align:center;z-index:3;display:flex;flex-direction:column;align-items:center;transform:translateY(-.5vh)}
.eyebrow{margin:0 0 15px;font:700 clamp(11px,1.7vw,14px)/1.2 Arial,sans-serif;letter-spacing:.48em;color:#d8bb78;text-transform:uppercase}
.crown{font:400 clamp(25px,4vw,38px)/1 Georgia,serif;color:var(--gold);text-shadow:0 0 18px rgba(255,209,93,.7);margin-bottom:11px;animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 28px rgba(255,209,93,.95),0 0 52px rgba(213,145,42,.26)}}
.portal{
  position:relative;width:clamp(190px,28vw,300px);aspect-ratio:1/1.18;
  display:grid;place-items:center;margin:0 auto 14px;
}
.portal:before,.portal:after{content:"";position:absolute;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;inset:0;border:1px solid rgba(250,217,137,.7);box-shadow:0 0 30px rgba(244,190,74,.14),inset 0 0 32px rgba(255,213,112,.06)}
.portal:after{inset:10px;border-color:rgba(255,235,180,.19);box-shadow:none}
.bigB{
  position:relative;z-index:2;font:500 clamp(165px,24vw,265px)/.78 Georgia,'Times New Roman',serif;
  color:transparent;-webkit-text-stroke:1.5px #f7d98f;
  text-shadow:0 0 12px rgba(255,239,190,.55),0 0 34px rgba(226,163,52,.24);
  transform:translateY(-2px);
}
.portalGlow{position:absolute;inset:18% 19%;border-radius:50%;background:radial-gradient(circle,rgba(255,224,143,.18),rgba(147,72,178,.08) 48%,transparent 72%);filter:blur(2px);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.72}}
.title{margin:9px 0 5px;font:500 clamp(34px,5.8vw,64px)/.96 Georgia,'Times New Roman',serif;letter-spacing:.15em;color:var(--cream);text-shadow:0 2px 18px rgba(0,0,0,.35)}
.subtitle{margin:12px 0 0;font:600 clamp(12px,2vw,16px)/1.4 Arial,sans-serif;letter-spacing:.33em;color:#eee2cc;text-transform:uppercase}
.subtitle span{color:var(--gold)}
.rule{display:flex;align-items:center;gap:12px;width:min(420px,72vw);margin:24px auto 0;color:var(--gold)}
.rule:before,.rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(233,190,97,.68))}.rule:after{background:linear-gradient(90deg,rgba(233,190,97,.68),transparent)}
.rule i{width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg)}
.enter{
  position:relative;margin-top:30px;width:min(360px,78vw);min-height:68px;padding:0 32px;border:1px solid #ffeab0;border-radius:999px;
  color:#1b0a18;background:linear-gradient(115deg,#fff0b9 0%,#e9ba58 42%,#ffd978 67%,#c78f32 100%);
  font-weight:900;font-size:clamp(16px,2.6vw,20px);letter-spacing:.22em;cursor:pointer;touch-action:manipulation;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 12px 32px rgba(0,0,0,.34),0 0 32px rgba(239,191,76,.16);
  transition:transform .18s ease,box-shadow .18s ease;
}
.enter:after{content:"✦";margin-left:12px;font-size:.8em}
.enter:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 15px 38px rgba(0,0,0,.38),0 0 42px rgba(239,191,76,.25)}
.enter:active{transform:scale(.975)}
.enter:focus-visible{outline:3px solid #fff;outline-offset:5px}
.hint{margin:15px 0 0;color:#bcae9d;font:500 11px/1.3 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe39a;box-shadow:0 0 11px #ffd465;opacity:.65;animation:float 5s ease-in-out infinite}
.s1{left:13%;top:27%}.s2{right:14%;top:35%;animation-delay:-2s}.s3{left:20%;bottom:18%;animation-delay:-3.4s}.s4{right:23%;bottom:14%;animation-delay:-1.1s}
@keyframes float{50%{transform:translateY(-13px) scale(1.35);opacity:1}}
@media(max-width:720px){
  .shell{width:100%;height:100dvh;max-height:none}.frame{inset:1px;border-radius:46% 46% 24px 24px/9% 9% 24px 24px}.frame2{inset:9px;border-radius:44% 44% 18px 18px/8% 8% 18px 18px}
  .ornament{top:2px}.content{width:88vw}.eyebrow{letter-spacing:.38em;margin-bottom:10px}.crown{margin-bottom:8px}
  .portal{width:clamp(178px,52vw,245px);margin-bottom:10px}.bigB{font-size:clamp(155px,50vw,220px)}
  .title{font-size:clamp(34px,10vw,48px);letter-spacing:.12em;margin-top:6px}.subtitle{font-size:clamp(11px,3.2vw,14px);letter-spacing:.25em;margin-top:10px}
  .rule{margin-top:19px}.enter{margin-top:25px;min-height:62px;width:min(330px,82vw)}.hint{font-size:10px;margin-top:13px}
  .spark{display:none}
}
@media(max-height:700px){
  .content{transform:none}.eyebrow{margin-bottom:6px}.crown{font-size:23px;margin-bottom:4px}.portal{width:155px;margin-bottom:5px}.bigB{font-size:137px}
  .title{font-size:31px;margin-top:3px}.subtitle{margin-top:6px}.rule{margin-top:13px}.enter{margin-top:17px;min-height:52px}.hint{display:none}
}
@media(prefers-reduced-motion:reduce){.stage:before,.crown,.portalGlow,.spark{animation:none}.enter{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <section class="shell" aria-label="Birthday entrance for Beaux">
    <div class="frame"></div><div class="frame2"></div>
    <div class="ornament" aria-hidden="true"><span class="jewel"></span></div>
    <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
    <div class="content">
      <p class="eyebrow">A birthday experience</p>
      <div class="crown" aria-hidden="true">♕</div>
      <div class="portal" aria-hidden="true"><div class="portalGlow"></div><div class="bigB">B</div></div>
      <h1 class="title">FOR BEAUX</h1>
      <p class="subtitle">One letter <span>•</span> One sister <span>•</span> 100 memories</p>
      <div class="rule" aria-hidden="true"><i></i></div>
      <button class="enter" id="enter" type="button">ENTER</button>
      <p class="hint">Tap once to open the memories</p>
    </div>
  </section>
</main>
<script>
const enter=document.getElementById('enter');
function go(){
  enter.disabled=true;
  document.body.style.opacity='.96';
  location.href='queen.html?v=queen-redesign-20260916&t='+Date.now();
}
enter.addEventListener('click',go);
enter.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
</script>
</body>
</html>
