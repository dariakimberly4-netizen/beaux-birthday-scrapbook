<title>B for Beaux</title>
<style>
:root{--gold:#f4d48a;--gold2:#ffb84e;--deep:#05030c;--violet:#25123f;--violet2:#5c2c86}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep);color:#fff;font-family:Arial,sans-serif}body{min-height:100dvh}button{-webkit-tap-highlight-color:transparent}
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 37%,#5c2c86 0%,#2d174d 25%,#160b2a 52%,#07040f 78%,#030208 100%)}

.card{position:relative;z-index:8;width:min(94vw,650px);text-align:center;transform:translateY(-1vh)}.crown{font:500 clamp(34px,7vw,56px)/1 Georgia,serif;color:var(--gold);text-shadow:0 0 18px #ffc95a,0 0 38px #ffae3a77;animation:crownFloat 4.5s ease-in-out infinite alternate;margin-bottom:-8px}@keyframes crownFloat{from{transform:translateY(1px) scale(.98)}to{transform:translateY(-7px) scale(1.05)}}

.enter{position:relative;overflow:hidden;margin-top:34px;width:min(76vw,410px);height:104px;border:1px solid rgba(255,242,196,.92);border-radius:999px;background:linear-gradient(135deg,#ffe9ad 0%,#e7bf67 48%,#b8862c 100%);color:#17101f;font-weight:900;font-size:clamp(22px,5vw,31px);letter-spacing:.15em;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 0 0 2px rgba(244,212,138,.13),0 0 28px #ffc14b88,0 18px 42px rgba(0,0,0,.34);cursor:pointer;touch-action:manipulation;animation:buttonPulse 3.8s ease-in-out infinite alternate}.enter::before{content:"";position:absolute;top:-80%;left:-34%;width:24%;height:250%;background:linear-gradient(90deg,transparent,#fff9dcdd,transparent);transform:rotate(21deg);animation:sweep 4.8s ease-in-out infinite}@keyframes sweep{0%,58%{left:-34%}82%,100%{left:125%}}@keyframes buttonPulse{from{box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 0 18px #ffc14b5c,0 16px 38px rgba(0,0,0,.32)}to{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 42px #ffc14bb0,0 18px 44px rgba(0,0,0,.36)}}.enter:active{transform:scale(.975)}.enter:focus-visible{outline:3px solid #fff5c3;outline-offset:6px}

@media(min-width:900px){.card{transform:none}.crown{font-size:44px}.bigB{font-size:300px}.title{font-size:50px}.enter{height:78px;width:330px;margin-top:28px;font-size:21px}.moon{top:5%}.water{height:15%}}@media(max-height:760px){.crown{font-size:29px}.bigB{font-size:175px}.title{font-size:30px;margin-top:0}.enter{height:72px;margin-top:20px}.rule{margin-bottom:8px}.moon{display:none}}@media(max-width:520px){.frame{inset:2.5% 3%}.butterfly{transform:scale(.78)}.enter{height:92px;margin-top:28px}.water{height:16%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.sparkField,.butterflies{display:none}.gate::before{display:none}.fade{opacity:0!important}.bigB,.crown{transform:none!important}}
</style></head><body>
<main class="gate" id="gate" aria-label="B for Beaux entrance"><div class="curtain left"></div><div class="curtain right"></div><div class="moon" aria-hidden="true"></div><div class="frame" aria-hidden="true"></div><div class="sparkField" id="sparkField" aria-hidden="true"></div><div class="butterflies" id="butterflies" aria-hidden="true"></div><div class="water" aria-hidden="true"></div><div class="card"><div class="crown" aria-hidden="true">♕</div><div class="bigB" aria-hidden="true">B</div><h1 class="title">FOR BEAUX</h1><div class="rule" aria-hidden="true"><span></span><b>♥</b><span></span></div><p class="subtitle">ONE LETTER • ONE SIS</p><button class="enter" id="enter">ENTER</button></div></main>
<script>const gate=document.getElementById('gate'),sparkField=document.getElementById('sparkField'),butterflies=document.getElementById('butterflies');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduced){const sparkCount=innerWidth<600?24:46;for(let i=0;i<sparkCount;i++){const s=document.createElement('i');s.className='spark';s.style.left=(4+Math.random()*92)+'%';s.style.top=(20+Math.random()*76)+'%';s.style.setProperty('--d',(7+Math.random()*8)+'s');s.style.setProperty('--delay',(-Math.random()*12)+'s');s.style.setProperty('--x',(-28+Math.random()*56)+'px');sparkField.appendChild(s)}const bf=innerWidth<600?5:9;for(let i=0;i<bf;i++){const b=document.createElement('i');b.className='butterfly';b.style.left=(7+Math.random()*86)+'%';b.style.top=(13+Math.random()*66)+'%';b.style.setProperty('--fd',(5+Math.random()*5)+'s');b.style.setProperty('--fdelay',(-Math.random()*8)+'s');butterflies.appendChild(b)}}document.getElementById('enter').addEventListener('click',()=>{if(!reduced)gate.classList.add('fade');setTimeout(()=>location.href='queen.html?v=repo-only-1',reduced?0:420)});</script></body></html>
