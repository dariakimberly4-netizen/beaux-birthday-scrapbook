<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16051f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BEAUX — The Queen B</title>
<style>
:root{--ink:#0a020d;--purple:#24072f;--violet:#4e1763;--gold:#f4d785;--gold2:#bd8432;--ivory:#fff8e8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit}
.hero{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:linear-gradient(115deg,#09020c 0 34%,#190622 56%,#351043 100%)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 77% 46%,rgba(151,70,179,.45),transparent 28%),radial-gradient(circle at 18% 15%,rgba(255,209,102,.08),transparent 25%);z-index:-3}
.hero:after{content:"";position:absolute;inset:-20%;background:linear-gradient(112deg,transparent 39%,rgba(255,224,147,.055) 47%,transparent 54%);animation:sweep 8s ease-in-out infinite alternate;z-index:-2}@keyframes sweep{to{transform:translateX(8%)}}
.edge{position:absolute;left:22px;top:22px;bottom:22px;width:1px;background:linear-gradient(transparent,rgba(247,214,126,.65) 15%,rgba(247,214,126,.65) 85%,transparent)}
.topline{position:absolute;left:42px;right:42px;top:28px;display:flex;justify-content:space-between;align-items:center;z-index:5;color:#d8bc79;font-size:11px;letter-spacing:.28em;text-transform:uppercase}.mini{display:flex;align-items:center;gap:10px}.diamond{width:7px;height:7px;border:1px solid var(--gold);transform:rotate(45deg)}
.layout{position:relative;z-index:3;width:100%;height:100%;display:grid;grid-template-columns:minmax(360px,46%) 1fr;align-items:center;padding:76px 6vw 58px 8vw;gap:4vw}
.copy{max-width:650px}.kicker{margin:0 0 18px;color:#d9bb78;font-size:12px;font-weight:800;letter-spacing:.42em;text-transform:uppercase}.crown{font:400 34px/1 Georgia,serif;color:var(--gold);text-shadow:0 0 22px rgba(255,214,119,.65);margin-bottom:18px}
.name{margin:0;color:var(--ivory);font:500 clamp(62px,7.2vw,112px)/.78 Georgia,'Times New Roman',serif;letter-spacing:.025em}.queen{display:block;margin-top:18px;color:var(--gold);font:500 clamp(24px,2.6vw,42px)/1 Georgia,'Times New Roman',serif;letter-spacing:.22em;text-transform:uppercase}
.desc{margin:30px 0 0;max-width:540px;color:#e7ddcf;font:400 clamp(16px,1.45vw,20px)/1.65 Georgia,serif}.desc strong{color:#fff3c8;font-weight:500}
.rule{width:min(410px,100%);height:1px;margin:30px 0 26px;background:linear-gradient(90deg,var(--gold),rgba(244,215,133,.35),transparent)}
.meta{display:flex;gap:26px;align-items:center;color:#c5b8a8;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.meta b{color:var(--gold);font-size:15px}.enter{margin-top:34px;min-width:290px;min-height:70px;padding:0 34px;border:1px solid #ffe7a4;border-radius:12px;background:linear-gradient(135deg,#f9e8aa,#d5a24b 52%,#b77a27);color:#180816;font-weight:900;font-size:17px;letter-spacing:.18em;cursor:pointer;box-shadow:0 18px 38px rgba(0,0,0,.28),0 0 34px rgba(237,190,84,.15);touch-action:manipulation;transition:.2s}.enter:hover{transform:translateY(-2px);box-shadow:0 22px 44px rgba(0,0,0,.32),0 0 44px rgba(237,190,84,.22)}.enter:active{transform:scale(.98)}.enter:focus-visible{outline:3px solid #fff;outline-offset:5px}
.monogram{position:relative;height:min(78vh,760px);display:grid;place-items:center}.halo{position:absolute;width:min(43vw,610px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(244,215,133,.25);box-shadow:0 0 80px rgba(150,65,177,.18),inset 0 0 70px rgba(244,215,133,.04)}.halo:before,.halo:after{content:"";position:absolute;border-radius:50%;inset:7%;border:1px solid rgba(244,215,133,.12)}.halo:after{inset:15%;border-style:dashed;animation:spin 28s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bigB{position:relative;z-index:2;margin:0;color:transparent;-webkit-text-stroke:2px #f5d988;font:500 clamp(330px,42vw,620px)/.72 Georgia,'Times New Roman',serif;text-shadow:0 0 20px rgba(255,225,146,.35),0 0 70px rgba(167,85,191,.26);transform:translateY(-1%)}
.bigB:after{content:"B";position:absolute;inset:0;color:rgba(255,220,130,.035);-webkit-text-stroke:0;transform:translate(14px,10px);filter:blur(.4px)}
.ribbon{position:absolute;right:4%;bottom:7%;z-index:4;width:min(390px,35vw);padding:16px 20px;border-top:1px solid rgba(244,215,133,.55);border-bottom:1px solid rgba(244,215,133,.22);color:#e9dcc6;text-align:right;font:italic 16px/1.45 Georgia,serif}.ribbon b{display:block;color:var(--gold);font-style:normal;font-size:10px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:6px}
.spark{position:absolute;border-radius:50%;background:#ffe4a0;box-shadow:0 0 12px #ffc95e;opacity:.75;animation:float 5s ease-in-out infinite}.s1{width:5px;height:5px;right:19%;top:20%}.s2{width:3px;height:3px;right:8%;top:41%;animation-delay:-1.5s}.s3{width:4px;height:4px;right:25%;bottom:18%;animation-delay:-3s}@keyframes float{50%{transform:translateY(-15px) scale(1.3);opacity:1}}
@media(max-width:820px){
 .hero{background:linear-gradient(180deg,#17051f 0%,#260832 48%,#0b030f 100%)}.hero:before{background:radial-gradient(circle at 50% 24%,rgba(146,61,171,.55),transparent 30%),radial-gradient(circle at 50% 70%,rgba(255,210,100,.05),transparent 28%)}
 .edge{display:none}.topline{top:18px;left:20px;right:20px;font-size:9px}.topline span:last-child{display:none}
 .layout{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:52px 20px max(22px,env(safe-area-inset-bottom));gap:0;text-align:center}
 .monogram{order:1;height:39dvh;min-height:250px;width:100%;margin-top:4px}.halo{width:min(74vw,330px)}.bigB{font-size:min(55dvh,310px);line-height:.74}
 .copy{order:2;max-width:560px;margin-top:-4px;display:flex;flex-direction:column;align-items:center}.kicker{font-size:9px;letter-spacing:.34em;margin:0 0 7px}.crown{display:none}.name{font-size:clamp(42px,13vw,62px);line-height:.82}.queen{margin-top:12px;font-size:clamp(18px,5vw,25px);letter-spacing:.16em}.desc{margin-top:17px;font-size:15px;line-height:1.45;max-width:340px}.rule{margin:18px auto 15px;width:72%}.meta{gap:14px;font-size:9px;letter-spacing:.12em}.meta b{font-size:12px}.enter{margin-top:20px;min-width:min(82vw,330px);min-height:62px;border-radius:999px;font-size:15px}.ribbon{display:none}.spark{display:none}
}
@media(max-width:820px) and (max-height:720px){.monogram{height:32dvh;min-height:190px}.bigB{font-size:190px}.halo{width:210px}.desc{display:none}.rule{margin:12px auto}.enter{margin-top:14px;min-height:54px}.name{font-size:40px}.queen{font-size:17px}}
@media(prefers-reduced-motion:reduce){.hero:after,.halo:after,.spark{animation:none}.enter{transition:none}}
</style>
</head>
<body>
<main class="hero" aria-label="Birthday entrance for Beaux">
 <div class="edge" aria-hidden="true"></div>
 <div class="topline"><div class="mini"><i class="diamond"></i><span>A birthday experience</span></div><span>Made with 100 memories</span></div>
 <div class="layout">
  <section class="copy">
   <p class="kicker">For my sister</p>
   <div class="crown" aria-hidden="true">♕</div>
   <h1 class="name">BEAUX<span class="queen">The Queen B</span></h1>
   <p class="desc">One letter. One sister. <strong>A hundred real memories</strong> waiting behind the B.</p>
   <div class="rule" aria-hidden="true"></div>
   <div class="meta"><span><b>100</b> memories</span><span>•</span><span><b>1</b> sister</span></div>
   <button class="enter" id="enter" type="button">ENTER THE B</button>
  </section>
  <section class="monogram" aria-hidden="true">
   <div class="halo"></div><div class="bigB">B</div>
   <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>
  </section>
 </div>
 <div class="ribbon"><b>Queen B</b>Every piece of the B is a memory.</div>
</main>
<script>
const enter=document.getElementById('enter');
function go(){enter.disabled=true;location.href='queen.html?v=queen-split-redesign-20260916&t='+Date.now()}
enter.addEventListener('click',go);
enter.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
</script>
</body>
</html>
