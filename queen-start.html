<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16051f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BEAUX — THE QUEEN B</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15051e;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit}
body{background:radial-gradient(circle at 50% 22%,#6f2c8d 0,#321044 36%,#17061f 68%,#0b020f 100%)}
.world{position:fixed;inset:0;overflow:hidden;isolation:isolate;transition:filter .25s ease;background:radial-gradient(circle at 50% 20%,rgba(255,201,120,.08),transparent 20%)}
.world:before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 45deg,transparent 0 13%,rgba(255,222,154,.06) 17%,transparent 22% 46%,rgba(244,87,210,.06) 52%,transparent 58% 80%,rgba(143,75,255,.08) 84%,transparent 90%);animation:drift 26s linear infinite;z-index:-3}
.world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 20%,transparent 78%,rgba(0,0,0,.45));pointer-events:none;z-index:6}
@keyframes drift{to{transform:rotate(360deg)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 12% 18%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 25% 72%,#ffe9af 0 1px,transparent 1.5px),radial-gradient(circle at 78% 14%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 84% 66%,#e6c6ff 0 1px,transparent 1.5px),radial-gradient(circle at 52% 34%,#fff 0 1px,transparent 1.4px);opacity:.72;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{50%{opacity:.42}}
.shell{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);align-items:center;gap:clamp(20px,5vw,84px);padding:clamp(28px,5vw,82px);z-index:3;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .7s ease,filter .6s ease}
.copy{max-width:720px}.kicker{font-size:11px;font-weight:900;letter-spacing:.38em;text-transform:uppercase;color:#ffd979;margin-bottom:14px}.copy h1{margin:0;color:#fff8e9;font:500 clamp(54px,7vw,108px)/.84 Georgia,'Times New Roman',serif;letter-spacing:-.025em;text-shadow:0 0 50px rgba(255,225,158,.08)}.copy h1 em{font-style:normal;color:#ffd978}.copy p{max-width:600px;color:#eadced;font:400 clamp(16px,1.5vw,21px)/1.58 Georgia,serif;margin:24px 0 30px}.enter{min-height:68px;padding:0 34px;border-radius:999px;border:1px solid rgba(255,231,168,.9);background:linear-gradient(135deg,#fff0b8,#f7c35f 34%,#d66ed2 68%,#8d4cff);color:#21091b;font-weight:900;font-size:14px;letter-spacing:.18em;cursor:pointer;box-shadow:0 16px 42px rgba(0,0,0,.35),0 0 45px rgba(225,116,218,.18);transition:transform .18s ease}.enter:hover{transform:translateY(-2px)}.enter:active{transform:scale(.98)}
.portraitWrap{position:relative;justify-self:center;width:min(480px,42vw);height:min(72vh,760px);display:grid;place-items:end center}.portraitWrap:before{content:"";position:absolute;inset:10% 2% 2%;border-radius:48% 48% 34% 34%;background:radial-gradient(circle at 50% 40%,rgba(255,215,126,.19),rgba(180,81,255,.14) 36%,transparent 70%);filter:blur(16px)}.portrait{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 30px 34px rgba(0,0,0,.36))}
.crownGlyph{position:absolute;z-index:4;top:4%;left:50%;transform:translateX(-50%);font-size:clamp(48px,5vw,76px);filter:drop-shadow(0 0 18px rgba(255,212,109,.45));animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translate(-50%,-10px)}}
.breakLayer,.void,.cracks,.shards{position:fixed;inset:0;pointer-events:none}.breakLayer{z-index:30;opacity:0;background:rgba(255,255,255,0)}.cracks{z-index:31;opacity:0}.cracks:before,.cracks:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:120vmax;background:linear-gradient(180deg,transparent,rgba(255,239,183,.9),transparent);box-shadow:0 0 18px rgba(255,210,117,.55);transform-origin:50% 50%}.cracks:before{transform:translate(-50%,-50%) rotate(28deg)}.cracks:after{transform:translate(-50%,-50%) rotate(-41deg)}
.crack2,.crack3,.crack4{position:absolute;left:50%;top:50%;width:2px;height:120vmax;background:linear-gradient(180deg,transparent,rgba(232,178,255,.75),transparent);transform-origin:50% 50%;box-shadow:0 0 14px rgba(174,78,255,.45)}.crack2{transform:translate(-50%,-50%) rotate(74deg)}.crack3{transform:translate(-50%,-50%) rotate(111deg)}.crack4{transform:translate(-50%,-50%) rotate(146deg)}
.shards{z-index:32}.shard{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);border:1px solid rgba(255,225,151,.36);background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(161,70,255,.08));clip-path:polygon(50% 0,100% 100%,0 74%);opacity:0;transform:translate(-50%,-50%) rotate(var(--r));backdrop-filter:blur(3px)}
.void{z-index:28;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#2b0a3c 0,#12031b 35%,#030006 74%);opacity:0;transform:scale(.4);transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}.voidCore{width:min(640px,84vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff4b4 0 1.5%,#ffd36c 3%,#f16ed9 11%,#8c4fff 23%,#28083d 46%,#050008 72%);box-shadow:0 0 60px rgba(255,217,126,.35),0 0 180px rgba(150,71,255,.5);animation:portal 3s ease-in-out infinite;display:grid;place-items:center;text-align:center;padding:18%}.voidCore b{font:500 clamp(34px,6vw,76px)/.9 Georgia,serif;color:#fff4d2;letter-spacing:.02em;text-shadow:0 0 28px rgba(0,0,0,.55)}.voidCore span{display:block;margin-top:14px;font-size:10px;font-weight:900;letter-spacing:.25em;text-transform:uppercase;color:#ffd979}@keyframes portal{50%{transform:scale(1.06);box-shadow:0 0 80px rgba(255,217,126,.5),0 0 220px rgba(150,71,255,.65)}}
body.breaking .world{animation:worldShake .28s linear 3;filter:contrast(1.14) saturate(1.25)}body.breaking .cracks{opacity:1;transition:opacity .15s ease}body.breaking .breakLayer{opacity:1;animation:flash .35s ease 2}body.breaking .shell{transform:scale(1.025);filter:blur(.4px)}body.breaking .shard{animation:shatter 1.8s cubic-bezier(.18,.8,.2,1) forwards;animation-delay:var(--d)}body.collapsing .shell{transform:translateY(85vh) rotate(-3deg) scale(.82);opacity:0;filter:blur(5px)}body.collapsing .world{filter:brightness(.65) saturate(.8)}body.voiding .void{opacity:1;transform:scale(1)}body.voiding .cracks{opacity:0;transition:opacity .6s ease}
@keyframes worldShake{0%,100%{transform:translate(0)}25%{transform:translate(4px,-2px)}50%{transform:translate(-4px,2px)}75%{transform:translate(2px,4px)}}@keyframes flash{0%,100%{background:rgba(255,255,255,0)}40%{background:rgba(255,238,191,.22)}}@keyframes shatter{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.2)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--r) + 160deg)) scale(1.2)}}
@media(max-width:800px){.shell{grid-template-columns:1fr;align-content:center;text-align:center;padding:28px 18px}.copy{margin:auto}.copy p{margin:18px auto 24px}.copy h1{font-size:clamp(46px,15vw,72px)}.portraitWrap{position:absolute;inset:auto 50% 0 auto;transform:translateX(50%);width:min(88vw,430px);height:53vh;opacity:.34;z-index:-1}.enter{width:min(390px,88vw)}.crownGlyph{top:12%}}
@media(prefers-reduced-motion:reduce){.world:before,.stars,.crownGlyph,.voidCore{animation:none}.shard{display:none}body.breaking .world{animation:none}body.collapsing .shell{transition:opacity .2s ease;transform:none}.void{transition:opacity .3s ease;transform:none}}
</style>
</head>
<body>
<div class="world" id="world">
  <div class="stars"></div>
  <main class="shell">
    <section class="copy">
      <div class="kicker">THE QUEEN B</div>
      <h1>BEAUX<br><em>RULES THIS WORLD.</em></h1>
      <p>This looks like her birthday website. It is not. Somewhere underneath it, one hundred real memories are waiting to become a crown.</p>
      <button class="enter" id="breakBtn" type="button">BREAK THE WEBSITE</button>
    </section>
    <section class="portraitWrap" aria-label="Queen B portrait">
      <div class="crownGlyph" aria-hidden="true">♛</div>
      <img class="portrait" src="assets/queen-b-portrait-direct.jpg" alt="Beaux">
    </section>
  </main>
</div>
<div class="breakLayer"></div>
<div class="cracks"><i class="crack2"></i><i class="crack3"></i><i class="crack4"></i></div>
<div class="shards" id="shards"></div>
<div class="void" id="void"><div class="voidCore"><div><b>THE CROWN<br>WAS UNDERNEATH.</b><span>Entering 100 memories…</span></div></div></div>
<script>
const btn=document.getElementById('breakBtn'), shards=document.getElementById('shards');
for(let i=0;i<34;i++){const s=document.createElement('i');s.className='shard';const a=Math.PI*2*i/34,d=180+(i%7)*34;s.style.cssText=`--w:${28+(i%5)*18}px;--h:${34+(i%6)*22}px;--r:${(i*37)%180}deg;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--d:${(i%8)*.025}s`;shards.appendChild(s)}
function go(){
 if(document.body.classList.contains('breaking'))return;
 btn.disabled=true;btn.textContent='REALITY UNLOCKED';
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.body.classList.add('voiding');setTimeout(()=>location.href='crown-100-clean.html?v=queenbreak1',450);return}
 document.body.classList.add('breaking');
 setTimeout(()=>document.body.classList.add('collapsing'),900);
 setTimeout(()=>document.body.classList.add('voiding'),1650);
 setTimeout(()=>location.href='crown-100-clean.html?v=queenbreak1',3050);
}
btn.addEventListener('click',go);
</script>
</body>
</html>
