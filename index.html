<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday, Beaux</title><style>html,body{margin:0;min-height:100%;background:#eadbc8}#s{min-height:100vh;display:grid;place-items:center;font-family:Georgia,serif;color:#6c5546;font-size:20px;text-align:center;padding:24px}</style></head><body><div id="s">Preparing your memories…</div><script>(async()=>{let a=[];for(let i=1;i<=16;i++){let n=String(i).padStart(2,'0');let r=await fetch('parts/part-'+n+'.txt');if(!r.ok)throw Error('part');a.push(await r.text())}let b=atob(a.join(''));let u=Uint8Array.from(b,c=>c.charCodeAt(0));let h=new TextDecoder().decode(u);document.open();document.write(h);document.close()})().catch(e=>document.getElementById('s').textContent='Unable to load scrapbook. Please refresh.');</script></body></html>
