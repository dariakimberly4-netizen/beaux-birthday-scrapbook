<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BEAUX — The Living B</title>
<style>
:root{--bg:#080716;--ink:#fff9f1;--gold:#efd39b;--lav:#b9a7ff;--muted:#cfc9dc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button{font:inherit}body{background:radial-gradient(circle at 50% 43%,#33225c 0,#17112e 32%,#080716 72%);touch-action:manipulation}.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.45;box-shadow:0 0 8px #fff;pointer-events:none;animation:twinkle 3s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.12;transform:scale(.55)}}
#gate{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle,#36265d,#0a0819 68%);transition:.8s}#gate.hide{opacity:0;visibility:hidden;pointer-events:none}.gateCard{text-align:center}.gateB{font:900 clamp(170px,48vw,330px)/.72 Georgia,serif;color:transparent;-webkit-text-stroke:2px var(--gold);text-shadow:0 0 34px #b9a7ff88}#gate h1{font:500 clamp(28px,7vw,44px) Georgia,serif;letter-spacing:.13em;margin:24px 0 8px}.gateSub{color:var(--muted);font-size:12px;letter-spacing:.12em}.enter{margin-top:24px;min-width:190px;height:56px;border:0;border-radius:999px;background:linear-gradient(135deg,#f3dba9,#cda55e);font-weight:900;letter-spacing:.16em;color:#17101f;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:78px 10px 80px;opacity:0;transition:opacity .8s}#app.ready{opacity:1}.header{position:fixed;z-index:20;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:500 12px Georgia,serif;letter-spacing:.16em;line-height:1.4}.brand b{font-size:18px}.pill{height:44px;padding:0 14px;border-radius:999px;border:1px solid #ffffff35;background:#111027d9;color:#fff;cursor:pointer}
#stage{position:relative;width:min(95vw,650px);height:min(76vh,820px);filter:drop-shadow(0 30px 60px #000a)}#outline{position:absolute;inset:0;display:grid;place-items:center;font:900 min(79vw,680px)/1 Georgia,serif;color:transparent;-webkit-text-stroke:1.3px #efd39b33;text-shadow:0 0 42px #b9a7ff28;transform:scaleX(.84);pointer-events:none}#memories{position:absolute;inset:0}.memory{position:absolute;padding:0;margin:0;border:1px solid #f5d9a94d;border-radius:7px;overflow:hidden;background:#1a1530;box-shadow:0 4px 11px #0008;cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s}.memory:hover,.memory:focus-visible{z-index:8;filter:brightness(1.18);box-shadow:0 7px 24px #000a,0 0 18px #efd39b6b;outline:none}.memory img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}.memory.bad:after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#efd39b;background:#21183d;font-size:18px}.hint{position:fixed;bottom:18px;left:14px;right:14px;text-align:center;color:#d4cede;font-size:11px;letter-spacing:.06em}.hint strong{font:500 15px Georgia,serif;color:var(--gold)}
#viewer{position:fixed;z-index:60;inset:0;display:none;align-items:center;justify-content:center;padding:76px 18px 88px;background:#060611f4;backdrop-filter:blur(14px)}#viewer.show{display:flex}.frame{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}#big{max-width:92vw;max-height:76vh;width:auto;height:auto;object-fit:contain;border-radius:18px;border:1px solid #ffffff25;box-shadow:0 30px 90px #000}.close,.nav{position:absolute;z-index:3;border:1px solid #ffffff35;background:#16132bdd;color:#fff;cursor:pointer}.close{top:17px;right:17px;width:52px;height:52px;border-radius:50%;font-size:27px}.nav{top:50%;transform:translateY(-50%);width:52px;height:68px;border-radius:16px;font-size:28px}.prev{left:8px}.next{right:8px}.counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font:500 14px Georgia,serif;letter-spacing:.14em;color:var(--gold)}
#finale{position:fixed;z-index:80;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle,#4a3178,#140d2f 48%,#070713 80%)}#finale.show{display:grid}.finalB{font:900 clamp(190px,55vw,430px)/.7 Georgia,serif;color:transparent;-webkit-text-stroke:2px var(--gold);text-shadow:0 0 34px #b9a7ff99}.finalText{margin-top:34px;font:500 clamp(31px,8vw,64px)/1.05 Georgia,serif}.finalSmall{margin-top:12px;color:#ddd5ea;font-size:12px;letter-spacing:.1em}.again{margin-top:24px;height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--gold);font-weight:900;color:#18101f;cursor:pointer}
@media(max-width:620px){#app{padding:74px 8px 76px}#stage{width:97vw;height:73vh}.memory{border-radius:5px}.brand{max-width:58%}.pill{height:42px;padding:0 11px;font-size:12px}.hint{font-size:10px}.hint strong{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate"><div class="gateCard"><div class="gateB">B</div><h1>FOR BEAUX</h1><div class="gateSub">100 MEMORIES • ONE LETTER • ONE SIS</div><button id="enter" class="enter" type="button">ENTER</button></div></div>
<div id="app"><div class="header"><div class="brand"><b>BEAUX</b> — THE LIVING B</div><button id="finalBtn" class="pill" type="button">FINAL MESSAGE ✦</button></div><div id="stage"><div id="outline">B</div><div id="memories" aria-label="100 memories forming the letter B"></div></div><div class="hint"><strong>Every piece of the B is a memory.</strong><br>Tap a photo • swipe memories • return to the B</div></div>
<div id="viewer" aria-hidden="true"><button id="close" class="close" aria-label="Close">×</button><div class="frame"><button id="prev" class="nav prev" aria-label="Previous">‹</button><img id="big" alt="Beaux memory"><button id="next" class="nav next" aria-label="Next">›</button><div id="counter" class="counter">01 / 100</div></div></div>
<div id="finale"><div><div class="finalB">B</div><div class="finalText">HAPPY BIRTHDAY, SIS! 💜</div><div class="finalSmall">100 MEMORIES • ONE BEAUTIFUL LIFE • MORE TO COME</div><button id="again" class="again" type="button">BACK TO THE B</button></div></div>
<script src="assets/photos.js?v=20260914-0811"></script>
<script>
(()=>{
const photos=(window.BEAUX_PHOTOS||[]).slice(0,100),stage=document.getElementById('stage'),box=document.getElementById('memories'),gate=document.getElementById('gate'),app=document.getElementById('app'),viewer=document.getElementById('viewer'),big=document.getElementById('big'),counter=document.getElementById('counter'),finale=document.getElementById('finale');let current=0,tiles=[];
for(let i=0;i<46;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.animationDelay=(-Math.random()*3)+'s';document.body.appendChild(s)}
function bCells(){const cols=16,rows=22,c=document.createElement('canvas');c.width=cols*20;c.height=rows*20;const x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='900 420px Georgia,serif';x.fillText('B',c.width*.48,c.height*.51);const d=x.getImageData(0,0,c.width,c.height).data,pts=[];for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const px=Math.floor((col+.5)*20),py=Math.floor((r+.5)*20);if(d[(py*c.width+px)*4+3]>60)pts.push({col,row:r})}if(pts.length<=100)return pts;const chosen=[];for(let i=0;i<100;i++){const idx=Math.round(i*(pts.length-1)/99);chosen.push(pts[idx])}return chosen}
function build(){box.innerHTML='';tiles=[];const cells=bCells();const sw=stage.clientWidth,sh=stage.clientHeight,cols=16,rows=22,cw=sw/cols,ch=sh/rows,gap=Math.max(1,Math.min(3,cw*.08)),tw=cw-gap,th=ch-gap;photos.forEach((src,i)=>{const p=cells[i]||cells[i%cells.length],b=document.createElement('button');b.className='memory';b.type='button';b.setAttribute('aria-label','Open memory '+(i+1));b.style.left=(p.col*cw+gap/2)+'px';b.style.top=(p.row*ch+gap/2)+'px';b.style.width=tw+'px';b.style.height=th+'px';const im=document.createElement('img');im.src=src;im.alt='Memory '+(i+1);im.loading=i<30?'eager':'lazy';im.onerror=()=>b.classList.add('bad');b.appendChild(im);b.addEventListener('click',()=>openViewer(i));box.appendChild(b);tiles.push(b)});}
function openViewer(i){current=(i+photos.length)%photos.length;big.src=photos[current];counter.textContent=String(current+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');viewer.classList.add('show');viewer.setAttribute('aria-hidden','false')}
function closeViewer(){viewer.classList.remove('show');viewer.setAttribute('aria-hidden','true');tiles[current]?.focus({preventScroll:true})}
document.getElementById('enter').onclick=()=>{gate.classList.add('hide');app.classList.add('ready');setTimeout(build,120)};document.getElementById('close').onclick=closeViewer;document.getElementById('prev').onclick=()=>openViewer(current-1);document.getElementById('next').onclick=()=>openViewer(current+1);viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});let sx=0;viewer.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)openViewer(current+(dx<0?1:-1))},{passive:true});document.getElementById('finalBtn').onclick=()=>finale.classList.add('show');document.getElementById('again').onclick=()=>finale.classList.remove('show');let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150)});
})();
</script>
</body>
</html>
