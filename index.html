<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BEAUX Birthday Tunnel</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#493431;background:radial-gradient(circle at 50% 38%,#fffdf9,#f5e9e4 62%,#ead7d0)}button,input{font:inherit}.scene{position:fixed;inset:0;transition:.8s;overflow:hidden}.hide{opacity:0;visibility:hidden;pointer-events:none}#vault{z-index:5;display:grid;place-items:center}.wrap{text-align:center;width:min(92vw,420px)}.pic{width:min(46vw,190px);aspect-ratio:1;margin:auto;border-radius:50%;padding:7px;background:#fffaf3;box-shadow:0 0 0 1.5px #c9a569,0 18px 48px #5c3b3326,0 0 38px #edcbd455;animation:f 5.5s ease-in-out infinite;overflow:hidden;cursor:pointer}.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 72%;border-radius:50%}.heart{color:#b97180;font:20px Georgia;margin-top:22px}h1{font:500 44px Georgia;margin:8px 0 6px;letter-spacing:.13em}.status{font-size:11px;font-weight:800;letter-spacing:.25em;color:#92736c}.line{font:italic 16px Georgia;margin:14px 0;color:#725b55}.tap{border:0;background:none;letter-spacing:.18em;font-size:10px;color:#987871;font-weight:800}#card{position:absolute;left:50%;top:46%;width:min(86vw,360px);transform:translate(-50%,0) scaleY(.08);transform-origin:top;opacity:0;background:#fffaf4;border:1px solid #c9a56955;border-radius:12px;box-shadow:0 24px 55px #52362f22;padding:24px;transition:.65s}#card.open{opacity:1;transform:translate(-50%,0) scaleY(1)}.openstate .copy{display:none}.openstate .pic{width:min(30vw,130px);animation:none;transform:translateY(-22vh)}.ey{font-size:10px;letter-spacing:.2em;font-weight:800;margin-bottom:18px}label{display:block;text-align:left;font-size:10px;letter-spacing:.18em;font-weight:800}input{width:100%;height:44px;border:0;border-bottom:1px solid #b79b87;background:#fff8;text-align:center;font-size:20px;letter-spacing:.18em;outline:none}.enter{width:100%;margin-top:14px;height:44px;border:0;border-radius:999px;background:#493431;color:#fff;letter-spacing:.15em;font-size:10px;font-weight:800}.hint{border:0;background:none;margin-top:12px;color:#92756d;font-size:11px}#hint{display:none;font:italic 14px Georgia;margin-top:8px}#err{height:16px;margin-top:6px;color:#a05868;font-size:11px}
#tunnel{z-index:3}header{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.15em;z-index:8}#stage{position:absolute;inset:0;perspective:1000px;touch-action:none}.core{position:absolute;left:50%;top:50%;width:130px;height:130px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0 10%,#f4d9df88 30%,#c9a56933 55%,transparent 72%);box-shadow:0 0 35px #e9c6d466;animation:p 2.8s ease-in-out infinite;pointer-events:none}.bubble{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px;border-radius:50%;padding:4px;background:#fff9;box-shadow:0 12px 28px #51372e24,0 0 0 1px #c9a56966;overflow:hidden;will-change:transform,opacity,filter;cursor:pointer}.bubble img{width:100%;height:100%;object-fit:cover;border-radius:50%}.hero{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;z-index:6}.hero h2{font:500 42px/1 Georgia;margin:0;text-shadow:0 2px 18px #fff}.hero p{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#8c706a}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:9}.btn{padding:13px 17px;border-radius:999px;border:1px solid #0002;background:#fff9;backdrop-filter:blur(10px);font-size:10px;font-weight:800;letter-spacing:.1em}#focus{position:fixed;inset:0;background:#3f2c2a99;backdrop-filter:blur(8px);z-index:20;display:none;place-items:center}#focus.show{display:grid}#focus img{width:min(76vw,360px);aspect-ratio:1;object-fit:cover;border-radius:50%;padding:8px;background:#fffaf4;box-shadow:0 0 0 2px #c9a569,0 24px 60px #0005}#final{position:fixed;inset:0;z-index:30;background:radial-gradient(circle,#fffdf9,#f4e4df);display:none;place-items:center;text-align:center;padding:28px}#final.show{display:grid}#final h3{font:500 58px Georgia;margin:0}#final p{font:24px/1.45 Georgia;max-width:620px}@keyframes f{50%{transform:translateY(-7px) rotate(.3deg)}}@keyframes p{50%{transform:translate(-50%,-50%) scale(1.08)}}
</style></head><body>
<section id="vault" class="scene"><div class="wrap" id="wrap"><div class="pic" id="pic"><img src="https://drive.google.com/thumbnail?id=1zh1cxp5hcBl0ZGsoIercv51RSxszmMSb&sz=w1200" onerror="this.src='https://lh3.googleusercontent.com/d/1zh1cxp5hcBl0ZGsoIercv51RSxszmMSb=w1200'"></div><div class="copy"><div class="heart">𓆩♡𓆪</div><h1>BEAUX</h1><div class="status" id="status">LOCKED</div><div class="line">“Something special is waiting for you.”</div><button class="tap" id="tap">TAP THE PHOTO</button></div><div id="card"><div class="ey">PRIVATE BIRTHDAY VAULT</div><label>PASSKEY</label><input id="pass"><button class="enter" id="enter">ENTER</button><button class="hint" id="hb">Need a tiny hint?</button><div id="hint">the birthday girl’s name ♡</div><div id="err"></div></div></div></section>
<section id="tunnel" class="scene hide"><header><span>BEAUX ♡</span><span>100 MEMORIES</span></header><div class="hero"><div><div class="heart">𓆩♡𓆪</div><h2>HAPPY<br>BIRTHDAY</h2><p>infinite birthday tunnel</p></div></div><div class="core"></div><div id="stage"></div><div class="controls"><button class="btn" id="warp">WARP ✦</button><button class="btn" id="for">FOR BEAUX ♡</button></div></section>
<div id="focus"><img id="focusimg"></div><div id="final"><div><h3>BEAUX ♡</h3><p>Out of all these memories, my favorite part has always been having you as my sister.</p><button class="btn" id="back">BACK TO THE TUNNEL</button></div></div>
<script>
const IDS=['1zh1cxp5hcBl0ZGsoIercv51RSxszmMSb', '1-QVlGgM0BqfcUQqWcQLNPlzoDztmzcpg', '1ONzcyGleKAL39Wl3BP4JHSF04wpkuUxT', '1_-ca47E29UUEVxlmK64GAN_tZ4YQfbaP', '1L9YqKXnmXQx6j-xS2dp6QvOfu4oHi1q7', '1SMMWYdG0DtjnhH_u9KYqBRS_eNX4Ls2l', '19hKTEOxavIecIMoJbimuODSOJXK-4Np6', '1Yxjpv34EWj758TA_FuRB4_R1RHGeZ6eL', '1frYwatctg6od3LQhvl3atnZTjDDCNAxP', '1HBeZ7kuMR_OXKO3IaZOTlFnsIcV16mOu', '14sTEaEBPn5nxEUrV1Nh_c6DVkUp5SItR', '1o7OlBVPnmvnoAxVMTo7d-AZM396Mv8vo'];const urls=IDS.map(id=>`https://drive.google.com/thumbnail?id=${id}&sz=w1200`);
const wrap=document.querySelector('#wrap'),card=document.querySelector('#card'),pass=document.querySelector('#pass'),err=document.querySelector('#err'),vault=document.querySelector('#vault'),tun=document.querySelector('#tunnel');
function openCard(){wrap.classList.add('openstate');card.classList.add('open')}document.querySelector('#pic').onclick=openCard;document.querySelector('#tap').onclick=openCard;document.querySelector('#hb').onclick=()=>document.querySelector('#hint').style.display='block';
document.querySelector('#enter').onclick=()=>{if(pass.value.trim().toUpperCase()!=='BEAUX'){err.textContent="That key doesn’t fit yet ♡";return}document.querySelector('#status').textContent='UNLOCKED';setTimeout(()=>{tun.classList.remove('hide');vault.classList.add('hide');start()},650)};pass.onkeydown=e=>{if(e.key==='Enter')document.querySelector('#enter').click()};
let items=[],drag=false,lastX=0,rot=0,target=0,boost=0,running=false;const stage=document.querySelector('#stage');
function mk(i){let b=document.createElement('div');b.className='bubble';let im=new Image();im.src=urls[i%urls.length];im.onerror=()=>{let id=IDS[i%IDS.length];im.src=`https://lh3.googleusercontent.com/d/${id}=w1200`};b.appendChild(im);b.onclick=()=>{document.querySelector('#focusimg').src=im.src;document.querySelector('#focus').classList.add('show')};stage.appendChild(b);return{el:b,a:i*.57,r:[92,145,198][i%3],z:-1700+i*90,s:.008+(i%4)*.001}}
function start(){if(running)return;for(let i=0;i<22;i++)items.push(mk(i));running=true;requestAnimationFrame(loop)}function loop(){if(!running)return;rot+=(target-rot)*.08;items.forEach(o=>{o.z+=7+boost*14;o.a+=o.s;if(o.z>240)o.z=-1700;let p=950/(950-o.z),x=Math.cos(o.a+rot)*o.r*p,y=Math.sin(o.a+rot)*o.r*.58*p,sc=Math.max(.2,p),op=Math.max(.12,Math.min(1,(o.z+1800)/1700));o.el.style.transform=`translate(${x}px,${y}px) scale(${sc})`;o.el.style.opacity=op;o.el.style.filter=o.z<-1100?'blur(1.2px)':'none'});boost*=.94;requestAnimationFrame(loop)}
stage.onpointerdown=e=>{drag=true;lastX=e.clientX};stage.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lastX;target+=dx*.008;lastX=e.clientX};onpointerup=()=>drag=false;document.querySelector('#warp').onclick=()=>boost=1.4;document.querySelector('#focus').onclick=e=>e.currentTarget.classList.remove('show');document.querySelector('#for').onclick=()=>document.querySelector('#final').classList.add('show');document.querySelector('#back').onclick=()=>document.querySelector('#final').classList.remove('show');
</script></body></html>
