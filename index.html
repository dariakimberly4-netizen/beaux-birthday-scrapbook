<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BEAUX — Tiny Flower Memory Garden</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050706;color:#f7e6c7;font-family:Arial,sans-serif}
body{touch-action:none}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#2a251b55,transparent 38%),radial-gradient(circle at 15% 80%,#5c253833,transparent 26%),linear-gradient(#050706,#07100b);pointer-events:none}
.top{position:fixed;z-index:10;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand{letter-spacing:.26em;font:600 12px Georgia,serif}.brand b{font-size:18px;font-weight:400}
.gesture{pointer-events:auto;border:1px solid #c9a86c88;border-radius:30px;padding:11px 14px;background:#121411dd;color:#f4e6d1;font-size:12px;cursor:pointer}.gesture.on{background:#354631}
#world{position:absolute;inset:74px 0 108px;perspective:1100px;overflow:hidden}
#orbit{position:absolute;left:50%;top:50%;width:1px;height:1px;transform-style:preserve-3d;will-change:transform}
.flower{position:absolute;width:34px;height:34px;margin:-17px;transform-style:preserve-3d;cursor:pointer;transition:filter .2s,transform .2s}
.flower:hover,.flower:active{filter:brightness(1.35) drop-shadow(0 0 10px #ffb8b8)}
.petal{position:absolute;left:11px;top:1px;width:12px;height:18px;border-radius:60% 60% 45% 45%;background:linear-gradient(#ffe3df,#e99b9e);transform-origin:6px 16px;box-shadow:0 0 6px #ffb5a944}
.core{position:absolute;z-index:3;left:6px;top:6px;width:22px;height:22px;border:1.5px solid #f4d39c;border-radius:50%;overflow:hidden;background:#171916;box-shadow:0 0 12px #efb76a88}.core img{width:100%;height:100%;object-fit:cover}
.wildPetal{position:fixed;z-index:4;top:-8vh;width:9px;height:15px;border-radius:70% 20% 70% 20%;background:linear-gradient(#ffd4d4,#e9929c);opacity:.58;pointer-events:none;animation:fall var(--dur) linear infinite;filter:drop-shadow(0 0 5px #ffb9a866)}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0)}50%{transform:translate3d(var(--drift),50vh,0) rotate(240deg)}100%{transform:translate3d(calc(var(--drift)*-.5),112vh,0) rotate(520deg)}}
.spark{position:absolute;width:3px;height:3px;background:#f7d27b;border-radius:50%;box-shadow:0 0 9px #ffdf82;animation:blink 1.7s infinite alternate;pointer-events:none}@keyframes blink{to{opacity:.15;transform:scale(.5)}}
body.bloom #orbit{animation:wildBurst 2.4s cubic-bezier(.2,.8,.2,1)}@keyframes wildBurst{0%{scale:1}35%{scale:1.22}68%{scale:.95}100%{scale:1}}
.bottom{position:fixed;z-index:10;bottom:18px;left:0;right:0;text-align:center;color:#cfc5b6;font:11px/1.6 Arial;letter-spacing:.08em;pointer-events:none}.bottom strong{font:15px Georgia,serif;color:#e8c99c;letter-spacing:.11em}
.super{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:18px;border:1px solid #d6b36d;border-radius:999px;min-width:166px;height:50px;padding:0 20px;background:#101610ee;color:#efce95;font:14px Georgia,serif;letter-spacing:.1em;cursor:pointer}
#viewer{position:fixed;z-index:30;inset:0;display:none;background:#030403ef;place-items:center;padding:18px;touch-action:auto}#viewer.show{display:grid}#viewer img{max-width:94vw;max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:18px;box-shadow:0 20px 80px #000}.x{position:absolute;right:18px;top:18px;width:48px;height:48px;border-radius:50%;border:1px solid #fff6;background:#111d;color:#fff;font-size:27px;cursor:pointer}
#lock{position:fixed;z-index:999999;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle,#273126,#080b09 64%,#030403);pointer-events:auto;touch-action:manipulation}
#lock.hide{display:none!important}
.lockCard{position:relative;z-index:1000000;pointer-events:auto;width:min(92vw,440px)}
.hero{width:min(72vw,330px);height:min(42vh,320px);object-fit:cover;border-radius:48% 48% 44% 44%;border:1px solid #d7b778;box-shadow:0 0 50px #e4b86744;pointer-events:none}
#lock h1{font:clamp(30px,7vw,44px) Georgia,serif;letter-spacing:.17em;margin:17px 0 5px}.tiny{color:#cfc5b6;font-size:13px}
#lockForm{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1000001;pointer-events:auto;touch-action:manipulation}
#pw,#go{position:relative;z-index:1000002;pointer-events:auto!important;touch-action:manipulation!important}
#pw{height:50px;width:200px;border-radius:28px;padding:0 17px;background:#fffdf6;border:2px solid #d1b77d;text-align:center;letter-spacing:.15em;color:#17130f;font-size:16px;cursor:text!important;-webkit-appearance:none;appearance:none;user-select:text}
#go{height:50px;min-width:112px;border-radius:28px;padding:0 20px;border:0;background:#d0ac70;color:#15120e;font-weight:800;font-size:14px;cursor:pointer!important;-webkit-appearance:none;appearance:none}
#go:active{transform:scale(.97)}
.error{min-height:22px;margin-top:9px;color:#f2b2ad;font-size:12px}
@media(max-width:600px){.flower{width:30px;height:30px;margin:-15px}.petal{left:10px;width:10px;height:16px}.core{left:5px;top:5px;width:20px;height:20px}.brand{max-width:60%;line-height:1.5}.bottom{display:none}.super{bottom:18px}#pw{width:min(58vw,210px)}}
</style>
</head>
<body>
<div id="lock">
  <div class="lockCard">
    <img class="hero" id="lockImg" alt="Beaux with the two dogs">
    <h1>BEAUX</h1>
    <div class="tiny">A tiny flower garden made from memories.</div>
    <form id="lockForm" autocomplete="off">
      <input id="pw" name="password" type="password" autocomplete="off" placeholder="PASSWORD" aria-label="Password">
      <button id="go" type="submit">ENTER</button>
    </form>
    <div id="error" class="error"></div>
  </div>
</div>
<div class="top"><div class="brand"><b>BEAUX</b> — TINY FLOWER GARDEN</div><button id="motion" class="gesture" type="button">PAUSE MOTION</button></div>
<div id="world"><div id="orbit"></div></div>
<div class="bottom"><strong>Every tiny flower holds a memory.</strong><br>Drag the garden • tap a flower to open the photo</div>
<button id="bloom" class="super" type="button">WILD BLOOM ✦</button>
<div id="viewer"><button id="close" class="x" type="button">×</button><img id="big" alt="Memory"></div>
<script src="assets/dog-password.js?v=10"></script>
<script>
(function(){
  const dog=document.getElementById('lockImg');
  if(dog && window.BEAUX_DOG) dog.src=window.BEAUX_DOG;
  const lock=document.getElementById('lock');
  const form=document.getElementById('lockForm');
  const pw=document.getElementById('pw');
  const error=document.getElementById('error');
  function unlock(){
    if((pw.value||'').trim().toUpperCase()==='BEAUX'){
      lock.classList.add('hide');
      error.textContent='';
      document.body.style.touchAction='none';
    }else{
      error.textContent='Password is BEAUX ✦';
      pw.focus();
      pw.select();
    }
  }
  form.addEventListener('submit',function(e){e.preventDefault();unlock();});
  document.getElementById('go').addEventListener('click',function(e){e.preventDefault();unlock();});
  pw.addEventListener('keyup',function(e){if(e.key==='Enter'){e.preventDefault();unlock();}});
  setTimeout(function(){pw.focus();},150);
})();
</script>
<script src="assets/photos.js?v=10"></script>
<script>
(function(){
const photos=window.BEAUX_PHOTOS||[];
const orbit=document.getElementById('orbit'),world=document.getElementById('world'),viewer=document.getElementById('viewer'),big=document.getElementById('big');
function makeFlower(src,i){
 const f=document.createElement('div');f.className='flower';
 const ring=3+i%5,a=i*2.399963229728653,r=Math.min(innerWidth,innerHeight)*(0.16+ring*.045)+(i%7)*5;
 const x=Math.cos(a)*r,y=Math.sin(a)*r*.60,z=Math.sin(a*1.7)*120;
 f.style.transform=`translate3d(${x}px,${y}px,${z}px)`;
 for(let p=0;p<7;p++){const pet=document.createElement('span');pet.className='petal';pet.style.transform=`rotate(${p*51.43}deg)`;f.appendChild(pet)}
 const c=document.createElement('span');c.className='core';const im=document.createElement('img');im.src=src;im.loading='lazy';c.appendChild(im);f.appendChild(c);
 f.addEventListener('click',function(e){e.stopPropagation();big.src=src;viewer.classList.add('show')});orbit.appendChild(f);
}
photos.forEach(makeFlower);
for(let i=0;i<45;i++){const p=document.createElement('i');p.className='wildPetal';p.style.left=Math.random()*100+'vw';p.style.setProperty('--dur',(8+Math.random()*12)+'s');p.style.setProperty('--drift',(Math.random()*160-80)+'px');p.style.animationDelay=(-Math.random()*18)+'s';document.body.appendChild(p)}
for(let i=0;i<55;i++){const s=document.createElement('i');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*2+'s';world.appendChild(s)}
let rx=-8,ry=0,auto=true,drag=false,lx=0,ly=0;
function render(){if(auto&&!drag)ry+=.075;orbit.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;requestAnimationFrame(render)}render();
world.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;world.setPointerCapture?.(e.pointerId)});
world.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.25;rx-=(e.clientY-ly)*.18;rx=Math.max(-55,Math.min(55,rx));lx=e.clientX;ly=e.clientY});
const end=()=>drag=false;world.addEventListener('pointerup',end);world.addEventListener('pointercancel',end);
document.getElementById('motion').addEventListener('click',e=>{auto=!auto;e.currentTarget.textContent=auto?'PAUSE MOTION':'RESUME MOTION';e.currentTarget.classList.toggle('on',!auto)});
document.getElementById('bloom').addEventListener('click',()=>{document.body.classList.remove('bloom');void document.body.offsetWidth;document.body.classList.add('bloom');setTimeout(()=>document.body.classList.remove('bloom'),2500)});
document.getElementById('close').addEventListener('click',()=>viewer.classList.remove('show'));
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.classList.remove('show')});
})();
</script>
</body>
</html>
