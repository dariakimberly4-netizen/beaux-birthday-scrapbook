<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BEAUX — Birthday Universe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#120d18;color:#fff}button,input{font:inherit}.s{position:fixed;inset:0;overflow:hidden;transition:.7s;opacity:0;visibility:hidden;pointer-events:none;background:radial-gradient(circle at 50% 35%,#4c274f,#211327 55%,#0c0811)}.s.on{opacity:1;visibility:visible;pointer-events:auto}.stars:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:26px 26px;opacity:.18;animation:d 20s linear infinite;pointer-events:none;z-index:0}@keyframes d{to{background-position:100px 120px}}#vault{background:radial-gradient(circle at 50% 38%,#fffdf9,#f7e9ea 58%,#dbc7ef);color:#493431;display:grid;place-items:center}.wrap{text-align:center;width:min(92vw,430px);position:relative;z-index:2}.pic{width:min(55vw,220px);aspect-ratio:1;margin:auto;border-radius:50%;padding:8px;background:#fffaf4;box-shadow:0 0 0 2px #c7a25e,0 0 50px #ffb9df88,0 25px 70px #6b3c6b33;overflow:hidden;cursor:pointer;animation:fl 4.5s ease-in-out infinite}.pic img{width:100%;height:100%;object-fit:cover;border-radius:50%}@keyframes fl{50%{transform:translateY(-10px)}}h1{font:500 52px Georgia;margin:14px 0 4px;letter-spacing:.14em}.sub{font:italic 16px Georgia;color:#755c62}.tap,.btn{border:1px solid #ffffff42;background:#ffffff1d;color:inherit;border-radius:999px;padding:13px 17px;font-size:10px;font-weight:900;letter-spacing:.12em;backdrop-filter:blur(12px);cursor:pointer}#vault .tap{color:#6b5158;background:#fff9;border-color:#7c626b22;margin-top:12px}#card{position:absolute;left:50%;top:54%;width:min(88vw,360px);transform:translate(-50%,0) scaleY(.08);transform-origin:top;opacity:0;background:#fffaf4;border:1px solid #c7a25e66;border-radius:16px;padding:22px;box-shadow:0 24px 60px #51344b35;transition:.55s;z-index:3}#card.open{opacity:1;transform:translate(-50%,0) scaleY(1)}#card input{width:100%;height:44px;border:0;border-bottom:1px solid #b79b87;background:transparent;text-align:center;font-size:21px;letter-spacing:.18em;outline:none}#card .go{width:100%;margin-top:14px;background:#493431;color:#fff}#err{height:16px;color:#a05868;font-size:11px;margin-top:7px}#cake{display:grid;place-items:center}.cakebox{text-align:center;width:min(92vw,500px);padding:20px;position:relative;z-index:2}.cakebox h2{font:500 clamp(34px,7vw,58px) Georgia;margin:0 0 8px}.cakebox p{color:#f7ddec}.cakezone{height:330px;display:grid;place-items:center;position:relative;cursor:pointer;z-index:3;touch-action:manipulation}.aura{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#fff6,#ffbed955 38%,#d3b2ff33 58%,transparent 72%);filter:blur(8px);animation:p 2.6s ease-in-out infinite;pointer-events:none}@keyframes p{50%{transform:scale(1.08)}}.cake{position:relative;width:220px;height:220px;transition:.4s;pointer-events:none}.cake.awake{transform:scale(1.06);filter:drop-shadow(0 18px 30px #ffb9df55)}.top,.mid,.base,.plate{position:absolute;left:50%;transform:translateX(-50%);border-radius:999px}.top{bottom:82px;width:168px;height:72px;background:linear-gradient(#ffd5de,#f8b8c5);box-shadow:inset 0 -10px #f1a7b7}.mid{bottom:42px;width:190px;height:62px;background:linear-gradient(#ffe7c8,#e0ae63)}.base{bottom:18px;width:208px;height:40px;background:linear-gradient(#f8c3cf,#de8c9e)}.plate{bottom:0;width:244px;height:20px;background:#fff}.icing{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:174px;height:28px;border-radius:999px;background:#fff7fb}.candles{position:absolute;left:50%;top:-44px;transform:translateX(-50%);display:flex;gap:14px}.c{position:relative;width:12px;height:34px;border-radius:999px;background:repeating-linear-gradient(45deg,#f7d06b 0 6px,#fff1c3 6px 12px)}.flame{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:15px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff7c2,#ffd86c 40%,#ff7d2f);box-shadow:0 0 18px #ffcf5f;animation:f .16s infinite alternate}@keyframes f{to{transform:translateX(-50%) scale(1.08) rotate(3deg)}}.c.off .flame{opacity:0;transform:translateX(-50%) scale(.2)}.cakeBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:4}.cakeBtns button:disabled{opacity:.4}#uni .topbar{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;z-index:10;font-size:10px;letter-spacing:.14em}#stage{position:absolute;inset:0;perspective:1000px;touch-action:none;z-index:3}.core{position:absolute;left:50%;top:50%;width:135px;height:135px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#fff 0 5%,#ffccdf 15%,#9a5da0 52%,#2a1739 100%);box-shadow:0 0 60px #ffb9df99;z-index:2;pointer-events:none;font:700 22px Georgia}.node{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border-radius:50%;padding:4px;background:#fff9;box-shadow:0 12px 28px #0006,0 0 0 1px #fff7;overflow:hidden;cursor:pointer}.node img{width:100%;height:100%;object-fit:cover;border-radius:50%}.bar{position:absolute;bottom:20px;left:10px;right:10px;display:flex;justify-content:center;gap:8px;z-index:10;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#160d1ebd;backdrop-filter:blur(10px);display:none;place-items:center;z-index:30}.modal.on{display:grid}.modal img{width:min(78vw,400px);max-height:78vh;object-fit:contain;border:10px solid #fff;border-radius:16px;box-shadow:0 30px 70px #0008}.closeBtn{position:absolute;top:max(22px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));width:52px;height:52px;border-radius:50%;border:1px solid #ffffff66;background:#211429dd;color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:31;box-shadow:0 10px 30px #0008;backdrop-filter:blur(10px)}.closeBtn:hover{transform:scale(1.06);background:#45284b}.conf{position:fixed;top:-30px;width:10px;height:16px;border-radius:2px;animation:fall 4s linear forwards;z-index:50}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}</style></head><body><section id="vault" class="s on"><div class="wrap"><div class="pic" id="hero"><img id="heroImg" alt="Beaux"></div><h1>BEAUX</h1><div class="sub">Something magical is waiting for you.</div><button class="tap" id="tap">TAP THE PHOTO ✦</button><div id="card"><div style="font-size:10px;font-weight:900;letter-spacing:.18em;margin-bottom:14px">PRIVATE BIRTHDAY VAULT</div><input id="pass" placeholder="PASSKEY" autocomplete="off"><button class="tap go" id="enter">ENTER</button><div id="err"></div></div></div></section><section id="cake" class="s stars"><div class="cakebox"><div style="font-size:10px;letter-spacing:.2em">BIRTHDAY RITUAL</div><h2>Make a wish, Beaux ✨</h2><p>Tap the cake, then blow out the candles.</p><div class="cakezone" id="cakeTap"><div class="aura"></div><div class="cake" id="cakeObj"><div class="top"><div class="icing"></div><div class="candles"><div class="c"><div class="flame"></div></div><div class="c"><div class="flame"></div></div><div class="c"><div class="flame"></div></div><div class="c"><div class="flame"></div></div><div class="c"><div class="flame"></div></div></div></div><div class="mid"></div><div class="base"></div><div class="plate"></div></div></div><div class="cakeBtns"><button class="btn" id="blow" disabled>BLOW THE CANDLES</button><button class="btn" id="openU" disabled>OPEN THE BIRTHDAY UNIVERSE</button></div><p style="font-size:11px;opacity:.7">Mic blowing is supported. If it does not work, tap the button.</p></div></section><section id="uni" class="s stars"><div class="topbar"><b>BEAUX ♡</b><span id="memoryCount">MEMORIES</span></div><div class="core">BEAUX<br>WORLD</div><div id="stage"></div><div class="bar"><button class="btn" id="warp">WARP ✦</button><button class="btn" id="chaos">CHAOS ✨</button></div></section><div class="modal" id="modal"><button class="closeBtn" id="closePhoto" aria-label="Close photo">×</button><img id="big" alt="Birthday memory"></div><script src="assets/photos.js"></script><script>const PHOTOS=Array.isArray(window.BEAUX_PHOTOS)?window.BEAUX_PHOTOS:[];const heroLocal=PHOTOS.find(p=>p.includes('IMG-20260728-WA0000.jpg'))||PHOTOS[0]||'';document.getElementById('heroImg').src=heroLocal;document.getElementById('memoryCount').textContent=`${PHOTOS.length} MEMORIES`;const $=id=>document.getElementById(id),vault=$('vault'),cake=$('cake'),uni=$('uni'),card=$('card'),pass=$('pass'),err=$('err'),cakeTap=$('cakeTap'),cakeObj=$('cakeObj'),blow=$('blow'),openU=$('openU'),stage=$('stage'),modal=$('modal'),big=$('big'),closePhoto=$('closePhoto');function show(a,b){a.classList.remove('on');b.classList.add('on')}function openCard(){card.classList.add('open')}$('hero').addEventListener('click',openCard);$('tap').addEventListener('click',openCard);$('enter').addEventListener('click',()=>{if(pass.value.trim().toUpperCase()!=='BEAUX'){err.textContent='That key doesn’t fit yet ♡';return}err.textContent='';show(vault,cake)});pass.addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});let cakeReady=false,blown=false,stream=null,ac=null,an=null,raf=null,micTried=false;function confetti(n=90){for(let i=0;i<n;i++){const c=document.createElement('span');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=['#f7c7d5','#d5b171','#fff','#f5ddc6','#e7b7c0'][i%5];c.style.animationDuration=(3+Math.random()*2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5200)}}function activateCake(){if(cakeReady)return;cakeReady=true;cakeObj.classList.add('awake');blow.disabled=false;startMic()}cakeTap.addEventListener('click',activateCake);cakeTap.addEventListener('pointerup',activateCake);function extinguish(){if(blown)return;blown=true;document.querySelectorAll('.c').forEach((c,i)=>setTimeout(()=>c.classList.add('off'),i*90));blow.disabled=true;openU.disabled=false;confetti(80);stopMic()}blow.addEventListener('click',extinguish);openU.addEventListener('click',()=>{show(cake,uni);startUniverse()});async function startMic(){if(micTried)return;micTried=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=512;src.connect(an);const data=new Uint8Array(an.fftSize);const detect=()=>{an.getByteTimeDomainData(data);let sum=0;for(const v0 of data){const v=(v0-128)/128;sum+=v*v}if(Math.sqrt(sum/data.length)>.18){extinguish();return}raf=requestAnimationFrame(detect)};detect()}catch(e){}}function stopMic(){if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ac)ac.close().catch(()=>{});ac=null}let items=[],running=false,drag=false,lastX=0,target=0,rot=0,boost=0,chaosBoost=0;function mk(i){const b=document.createElement('div');b.className='node';const im=new Image();im.loading='lazy';im.src=PHOTOS[i%PHOTOS.length];b.appendChild(im);b.addEventListener('click',e=>{e.stopPropagation();big.src=im.src;modal.classList.add('on')});stage.appendChild(b);return{el:b,a:i*.61,r:[100,155,215,275][i%4],z:-1700+i*70,s:.006+(i%5)*.001}}function startUniverse(){if(running||!PHOTOS.length)return;const count=Math.min(PHOTOS.length,40);for(let i=0;i<count;i++)items.push(mk(i));running=true;requestAnimationFrame(loop)}function loop(){if(!running)return;rot+=(target-rot)*.08;const extra=chaosBoost*Math.sin(Date.now()*.003)*.002;items.forEach(o=>{o.z+=6+boost*13+chaosBoost*5;o.a+=o.s+extra;if(o.z>260)o.z=-1700;const p=950/(950-o.z),x=Math.cos(o.a+rot)*o.r*p,y=Math.sin(o.a+rot)*o.r*.58*p,sc=Math.max(.24,p),op=Math.max(.14,Math.min(1,(o.z+1800)/1750));o.el.style.transform=`translate(${x}px,${y}px) scale(${sc})`;o.el.style.opacity=op;o.el.style.filter=o.z<-1100?'blur(1.2px)':'none'});boost*=.94;chaosBoost*=.98;requestAnimationFrame(loop)}stage.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;stage.setPointerCapture?.(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;target+=(e.clientX-lastX)*.008;lastX=e.clientX});window.addEventListener('pointerup',()=>drag=false);$('warp').addEventListener('click',()=>boost=1.5);$('chaos').addEventListener('click',()=>{chaosBoost=1.8;confetti(45)});function closePhotoModal(){modal.classList.remove('on');big.src=''}closePhoto.addEventListener('click',e=>{e.stopPropagation();closePhotoModal()});modal.addEventListener('click',e=>{if(e.target===modal)closePhotoModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('on'))closePhotoModal()});</script></body></html>
