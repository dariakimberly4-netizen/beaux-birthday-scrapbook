<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BEAUX — The Living B</title>
<style>
:root{--bg:#070612;--ink:#fffaf3;--gold:#e8c78b;--gold2:#f5dfb2;--lav:#bcaeff;--muted:#d6cede}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}body{background:radial-gradient(circle at 50% 44%,#34235b 0,#17102b 35%,#090716 70%,#05040c 100%)}button{font:inherit}.star{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.34;box-shadow:0 0 7px #fff;pointer-events:none;animation:twinkle 3.4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.08;transform:scale(.5)}}
#gate{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle,#3a2864,#090716 70%);transition:.8s}#gate.hide{opacity:0;visibility:hidden;pointer-events:none}.gateCard{text-align:center}.gateB{font:700 clamp(180px,45vw,330px)/.72 Georgia,"Times New Roman",serif;color:transparent;-webkit-text-stroke:1.5px var(--gold2);text-shadow:0 0 30px #bcaeff66,0 0 70px #e8c78b2a}#gate h1{font:500 clamp(28px,7vw,44px) Georgia,serif;letter-spacing:.16em;margin:28px 0 8px}.gateSub{color:var(--muted);font-size:12px;letter-spacing:.14em}.enter{margin-top:25px;min-width:190px;height:54px;border:1px solid #f3dfb4;border-radius:999px;background:linear-gradient(135deg,#f1d8a1,#cda764);font-weight:800;letter-spacing:.18em;color:#17101f;cursor:pointer;box-shadow:0 14px 40px #0007}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 22px 72px;opacity:0;transition:opacity .8s}#app.ready{opacity:1}.header{position:fixed;z-index:20;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:500 12px Georgia,serif;letter-spacing:.18em;line-height:1.4}.brand b{font-size:18px}.pill{height:44px;padding:0 15px;border-radius:999px;border:1px solid #ffffff2f;background:#100e22d9;color:#fff;cursor:pointer;backdrop-filter:blur(10px)}
#stage{position:relative;width:min(65vw,690px);height:min(78vh,820px);filter:drop-shadow(0 30px 70px #000b)}#monogram{position:absolute;inset:-2% -4%;display:grid;place-items:center;pointer-events:none;font:700 min(73vh,760px)/1 Georgia,"Times New Roman",serif;color:transparent;-webkit-text-stroke:1px #e8c78b24;text-shadow:0 0 45px #bcaeff18;transform:scaleX(.9)}#memories{position:absolute;inset:0}.memory{position:absolute;padding:0;margin:0;border:1px solid #f0d6a35c;border-radius:999px;overflow:hidden;background:#1b1530;box-shadow:0 4px 12px #0009,0 0 8px #bcaeff18;cursor:pointer;transition:filter .16s,box-shadow .16s,transform .16s}.memory:hover,.memory:focus-visible{z-index:8;filter:brightness(1.16);box-shadow:0 8px 26px #000b,0 0 20px #e8c78b76;outline:none;transform:scale(1.08)}.memory img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}.memory.bad:after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#e8c78b;background:#21183d;font-size:15px}.bglow{position:absolute;inset:3% 8%;border-radius:50%;background:radial-gradient(ellipse,#bcaeff14,transparent 68%);filter:blur(24px);pointer-events:none}.hint{position:fixed;bottom:16px;left:14px;right:14px;text-align:center;color:#d8d0e1;font-size:11px;letter-spacing:.06em}.hint strong{font:500 15px Georgia,serif;color:var(--gold2)}
#viewer{position:fixed;z-index:60;inset:0;display:none;align-items:center;justify-content:center;padding:76px 18px 88px;background:#060611f4;backdrop-filter:blur(14px)}#viewer.show{display:flex}.frame{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}#big{max-width:92vw;max-height:76vh;width:auto;height:auto;object-fit:contain;border-radius:18px;border:1px solid #ffffff25;box-shadow:0 30px 90px #000}.close,.nav{position:absolute;z-index:3;border:1px solid #ffffff35;background:#16132bdd;color:#fff;cursor:pointer}.close{top:17px;right:17px;width:52px;height:52px;border-radius:50%;font-size:27px}.nav{top:50%;transform:translateY(-50%);width:52px;height:68px;border-radius:16px;font-size:28px}.prev{left:8px}.next{right:8px}.counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font:500 14px Georgia,serif;letter-spacing:.14em;color:var(--gold2)}
#finale{position:fixed;z-index:80;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle,#4a3178,#140d2f 48%,#070713 80%)}#finale.show{display:grid}.finalB{font:700 clamp(200px,55vw,430px)/.7 Georgia,"Times New Roman",serif;color:transparent;-webkit-text-stroke:1.5px var(--gold2);text-shadow:0 0 34px #bcaeff88,0 0 72px #e8c78b33}.finalText{margin-top:34px;font:500 clamp(31px,8vw,64px)/1.05 Georgia,serif}.finalSmall{margin-top:12px;color:#ddd5ea;font-size:12px;letter-spacing:.1em}.again{margin-top:24px;height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--gold2);font-weight:900;color:#18101f;cursor:pointer}
@media(max-width:620px){#app{padding:68px 7px 70px}#stage{width:84vw;height:74vh}.memory{border-radius:999px}.brand{max-width:58%}.pill{height:42px;padding:0 11px;font-size:12px}.hint{font-size:10px}.hint strong{font-size:14px}#monogram{font-size:min(72vh,650px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="gate"><div class="gateCard"><div class="gateB">B</div><h1>FOR BEAUX</h1><div class="gateSub">100 MEMORIES • ONE LETTER • ONE SIS</div><button id="enter" class="enter" type="button">ENTER</button></div></div>
<div id="app"><div class="header"><div class="brand"><b>BEAUX</b> — THE LIVING B</div><button id="finalBtn" class="pill" type="button">FINAL MESSAGE ✦</button></div><div id="stage"><div class="bglow"></div><div id="monogram">B</div><div id="memories" aria-label="100 memories forming an elegant letter B"></div></div><div class="hint"><strong>Every piece of the B is a memory.</strong><br>Tap a photo • swipe memories • return to the B</div></div>
<div id="viewer" aria-hidden="true"><button id="close" class="close" aria-label="Close">×</button><div class="frame"><button id="prev" class="nav prev" aria-label="Previous">‹</button><img id="big" alt="Beaux memory"><button id="next" class="nav next" aria-label="Next">›</button><div id="counter" class="counter">01 / 100</div></div></div>
<div id="finale"><div><div class="finalB">B</div><div class="finalText">HAPPY BIRTHDAY, SIS! 💜</div><div class="finalSmall">100 MEMORIES • ONE BEAUTIFUL LIFE • MORE TO COME</div><button id="again" class="again" type="button">BACK TO THE B</button></div></div>
<script src="assets/photos.js?v=20260914-0835"></script>
<script>
(()=>{
const photos=(window.BEAUX_PHOTOS||[]).slice(0,100),stage=document.getElementById('stage'),box=document.getElementById('memories'),gate=document.getElementById('gate'),app=document.getElementById('app'),viewer=document.getElementById('viewer'),big=document.getElementById('big'),counter=document.getElementById('counter'),finale=document.getElementById('finale');let current=0,tiles=[];
for(let i=0;i<36;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.animationDelay=(-Math.random()*3.4)+'s';document.body.appendChild(s)}
function getSlots(){let best=null;for(let cols=14;cols<=21;cols++){for(let rows=22;rows<=30;rows++){const c=document.createElement('canvas');c.width=cols*34;c.height=rows*34;const x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font=`700 ${Math.floor(c.height*.92)}px Georgia, Times New Roman, serif`;x.fillText('B',c.width*.47,c.height*.5);const d=x.getImageData(0,0,c.width,c.height).data,pts=[];for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const px=Math.floor((col+.5)*34),py=Math.floor((r+.5)*34);if(d[(py*c.width+px)*4+3]>55)pts.push({col,row:r})}if(pts.length>=100){const score=Math.abs(pts.length-112)+(cols*.2);if(!best||score<best.score)best={pts,cols,rows,score};}}}const src=best.pts,chosen=[];for(let i=0;i<100;i++)chosen.push(src[Math.round(i*(src.length-1)/99)]);return{pts:chosen,cols:best.cols,rows:best.rows};}
function build(){box.innerHTML='';tiles=[];const layout=getSlots(),cells=layout.pts,sw=stage.clientWidth,sh=stage.clientHeight;const minCol=Math.min(...cells.map(p=>p.col)),maxCol=Math.max(...cells.map(p=>p.col)),minRow=Math.min(...cells.map(p=>p.row)),maxRow=Math.max(...cells.map(p=>p.row)),usedCols=maxCol-minCol+1,usedRows=maxRow-minRow+1;const cw=sw/usedCols,ch=sh/usedRows,diam=Math.max(20,Math.min(cw,ch)*.84),xPad=(sw-usedCols*cw)/2,yPad=(sh-usedRows*ch)/2;photos.forEach((src,i)=>{const p=cells[i],b=document.createElement('button');b.className='memory';b.type='button';b.setAttribute('aria-label','Open memory '+(i+1));const left=xPad+(p.col-minCol)*cw+(cw-diam)/2,top=yPad+(p.row-minRow)*ch+(ch-diam)/2;b.style.left=left+'px';b.style.top=top+'px';b.style.width=diam+'px';b.style.height=diam+'px';const im=document.createElement('img');im.src=src;im.alt='Memory '+(i+1);im.loading=i<45?'eager':'lazy';im.onerror=()=>b.classList.add('bad');b.appendChild(im);b.addEventListener('click',()=>openViewer(i));box.appendChild(b);tiles.push(b)});}
function openViewer(i){current=(i+photos.length)%photos.length;big.src=photos[current];counter.textContent=String(current+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');viewer.classList.add('show');viewer.setAttribute('aria-hidden','false')}
function closeViewer(){viewer.classList.remove('show');viewer.setAttribute('aria-hidden','true');tiles[current]?.focus({preventScroll:true})}
document.getElementById('enter').onclick=()=>{gate.classList.add('hide');app.classList.add('ready');setTimeout(build,100)};document.getElementById('close').onclick=closeViewer;document.getElementById('prev').onclick=()=>openViewer(current-1);document.getElementById('next').onclick=()=>openViewer(current+1);viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});let sx=0;viewer.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)openViewer(current+(dx<0?1:-1))},{passive:true});document.getElementById('finalBtn').onclick=()=>finale.classList.add('show');document.getElementById('again').onclick=()=>finale.classList.remove('show');let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150)});
})();
</script>
</body>
</html>
