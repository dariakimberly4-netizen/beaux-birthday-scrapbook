<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BEAUX — The Living B</title>
<style>
:root{--bg:#05030d;--ink:#fffaf3;--gold:#e8c78b;--gold2:#f5dfb2;--lav:#bcaeff;--pink:#f3b6d5;--muted:#d6cede}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}body{background:radial-gradient(circle at 50% 42%,#4a2c83 0,#211240 26%,#0b0718 62%,#04030a 100%);touch-action:manipulation}button{font:inherit}
#stars,#petals,#butterflies,#trails,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.45;box-shadow:0 0 9px #fff;animation:twinkle var(--dur) ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.07;transform:scale(.4)}}.petal{position:absolute;width:10px;height:15px;border-radius:70% 25% 70% 25%;background:linear-gradient(#ffd9ea,#e8a2c4);opacity:.38;animation:fall linear infinite;filter:drop-shadow(0 0 5px #f3b6d544)}@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}50%{transform:translate3d(var(--drift),54vh,0) rotate(210deg)}100%{transform:translate3d(calc(var(--drift)*-.45),115vh,0) rotate(420deg)}}.bfly{position:absolute;width:15px;height:12px;opacity:.42;animation:flutter linear infinite}.bfly:before,.bfly:after{content:"";position:absolute;top:2px;width:7px;height:9px;background:linear-gradient(#fff7d8,#cdbbff);border-radius:80% 25% 80% 25%;filter:drop-shadow(0 0 7px #efd9a766)}.bfly:before{left:0;transform:rotate(-25deg)}.bfly:after{right:0;transform:scaleX(-1) rotate(-25deg)}@keyframes flutter{0%{transform:translate3d(0,0,0) rotate(0)}25%{transform:translate3d(22px,-14px,0) rotate(6deg)}50%{transform:translate3d(-10px,-30px,0) rotate(-4deg)}75%{transform:translate3d(18px,-14px,0) rotate(4deg)}100%{transform:translate3d(0,0,0) rotate(0)}}.trail{position:absolute;width:3px;height:3px;border-radius:50%;background:#f5dfb2;box-shadow:0 0 12px #f5dfb2;animation:trail .8s linear forwards}@keyframes trail{to{opacity:0;transform:scale(.2)}}.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff6cf;box-shadow:0 0 14px #f5dfb2;animation:spark 1.7s ease-out forwards}@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}10%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1)}}
#gate{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle,#4c2e82,#0a0718 68%);transition:.9s}#gate.hide{opacity:0;visibility:hidden;pointer-events:none}.gateCard{text-align:center}.gateB{font:700 clamp(190px,46vw,350px)/.72 Georgia,"Times New Roman",serif;color:transparent;-webkit-text-stroke:1.5px var(--gold2);text-shadow:0 0 34px #bcaeff88,0 0 88px #e8c78b33;animation:gatePulse 3s ease-in-out infinite alternate}@keyframes gatePulse{to{transform:scale(1.03);text-shadow:0 0 48px #bcaeffaa,0 0 100px #e8c78b44}}#gate h1{font:500 clamp(28px,7vw,44px) Georgia,serif;letter-spacing:.16em;margin:28px 0 8px}.gateSub{color:var(--muted);font-size:12px;letter-spacing:.14em}.enter{margin-top:25px;min-width:200px;height:56px;border:1px solid #f3dfb4;border-radius:999px;background:linear-gradient(135deg,#f1d8a1,#cda764);font-weight:900;letter-spacing:.18em;color:#17101f;cursor:pointer;box-shadow:0 14px 40px #0007}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 18px 72px;opacity:0;transition:opacity .8s}#app.ready{opacity:1}.header{position:fixed;z-index:20;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:500 12px Georgia,serif;letter-spacing:.18em;line-height:1.4}.brand b{font-size:18px}.actions{display:flex;gap:8px}.pill{height:44px;padding:0 14px;border-radius:999px;border:1px solid #ffffff2f;background:#100e22d9;color:#fff;cursor:pointer;backdrop-filter:blur(10px)}
#stage{position:relative;width:min(88vw,920px);height:min(77vh,810px);filter:drop-shadow(0 30px 72px #000c);transform-style:preserve-3d;transition:transform .18s linear}#mist{position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,#bcaeff22,transparent 24%),radial-gradient(circle at 50% 56%,#e8c78b16,transparent 22%),radial-gradient(circle at 43% 76%,#f3b6d514,transparent 20%);filter:blur(25px);pointer-events:none}#monogram{position:absolute;inset:-2% -4%;display:grid;place-items:center;pointer-events:none;font:700 min(73vh,760px)/1 Georgia,"Times New Roman",serif;color:transparent;-webkit-text-stroke:1px #e8c78b20;text-shadow:0 0 50px #bcaeff20;transform:scaleX(.9);animation:breathe 4s ease-in-out infinite alternate}@keyframes breathe{to{transform:scaleX(.9) scale(1.016)}}#memories{position:absolute;inset:0}.memory{position:absolute;padding:3px;margin:0;border:1px solid #f0d6a35c;border-radius:7px;overflow:hidden;background:#0b0916;box-shadow:0 4px 13px #0009,0 0 10px #bcaeff1f;cursor:pointer;transform-origin:center;will-change:left,top,transform,width,height;transition:box-shadow .16s,transform .16s}.memory:hover,.memory:focus-visible{z-index:8;box-shadow:0 9px 30px #000b,0 0 24px #e8c78b88;outline:none}.memory img{width:100%;height:100%;display:block;object-fit:contain;object-position:center;background:#0b0916;pointer-events:none}.memory.float{animation:float var(--fdur) ease-in-out infinite alternate}@keyframes float{from{transform:rotate(var(--rot)) translate(0,0)}to{transform:rotate(var(--rot)) translate(var(--fx),var(--fy))}}.hint{position:fixed;bottom:16px;left:14px;right:14px;text-align:center;color:#d8d0e1;font-size:11px;letter-spacing:.06em}.hint strong{font:500 15px Georgia,serif;color:var(--gold2)}
#viewer{position:fixed;z-index:60;inset:0;display:none;align-items:center;justify-content:center;padding:76px 18px 88px;background:#05040df4;backdrop-filter:blur(16px)}#viewer.show{display:flex}.frame{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}#big{max-width:92vw;max-height:76vh;width:auto;height:auto;object-fit:contain;border:1px solid #ffffff25;box-shadow:0 30px 100px #000;background:#0b0916}.close,.nav{position:absolute;z-index:3;border:1px solid #ffffff35;background:#16132bdd;color:#fff;cursor:pointer}.close{top:17px;right:17px;width:52px;height:52px;border-radius:50%;font-size:27px}.nav{top:50%;transform:translateY(-50%);width:52px;height:68px;border-radius:16px;font-size:28px}.prev{left:8px}.next{right:8px}.counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font:500 14px Georgia,serif;letter-spacing:.14em;color:var(--gold2)}
#finale{position:fixed;z-index:80;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 42%,#6540a8,#211240 40%,#070713 80%)}#finale.show{display:grid}.finalB{font:700 clamp(210px,57vw,450px)/.7 Georgia,"Times New Roman",serif;color:transparent;-webkit-text-stroke:1.5px var(--gold2);text-shadow:0 0 44px #bcaeffaa,0 0 95px #e8c78b44;animation:finalPulse 1.8s ease-in-out infinite alternate}@keyframes finalPulse{to{transform:scale(1.045)}}.finalText{margin-top:28px;font:500 clamp(32px,8vw,68px)/1.05 Georgia,serif}.finalSmall{margin-top:12px;color:#ddd5ea;font-size:12px;letter-spacing:.1em}.again{margin-top:24px;height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--gold2);font-weight:900;color:#18101f;cursor:pointer}
@media(max-width:620px){#app{padding:68px 7px 70px}#stage{width:95vw;height:73vh}.memory{border-radius:5px;padding:2px}.brand{max-width:48%}.pill{height:40px;padding:0 9px;font-size:11px}.hint{font-size:10px}.hint strong{font-size:14px}#monogram{font-size:min(70vh,640px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stars"></div><div id="petals"></div><div id="butterflies"></div><div id="trails"></div><div id="fx"></div>
<div id="gate"><div class="gateCard"><div class="gateB">B</div><h1>FOR BEAUX</h1><div class="gateSub">100 MEMORIES • ONE LETTER • ONE SIS</div><button id="enter" class="enter" type="button">ENTER</button></div></div>
<div id="app"><div class="header"><div class="brand"><b>BEAUX</b> — THE LIVING B</div><div class="actions"><button id="wildBtn" class="pill" type="button">WILD BLOOM ✦</button><button id="finalBtn" class="pill" type="button">FINAL ✦</button></div></div><div id="stage"><div id="mist"></div><div id="monogram">B</div><div id="memories" aria-label="100 original memories forming the letter B"></div></div><div class="hint"><strong>The B is alive.</strong><br>Original photos preserved • tap a memory • trigger Wild Bloom</div></div>
<div id="viewer" aria-hidden="true"><button id="close" class="close" aria-label="Close">×</button><div class="frame"><button id="prev" class="nav prev" aria-label="Previous">‹</button><img id="big" alt="Beaux memory"><button id="next" class="nav next" aria-label="Next">›</button><div id="counter" class="counter">01 / 100</div></div></div>
<div id="finale"><div><div class="finalB">B</div><div class="finalText">HAPPY BIRTHDAY, SIS! 💜</div><div class="finalSmall">100 MEMORIES • ONE BEAUTIFUL LIFE • MORE TO COME</div><button id="again" class="again" type="button">BACK TO THE B</button></div></div>
<script src="assets/photos.js?v=20260914-0908"></script>
<script>
(()=>{const photos=(window.BEAUX_PHOTOS||[]).slice(0,100),stage=document.getElementById('stage'),box=document.getElementById('memories'),gate=document.getElementById('gate'),app=document.getElementById('app'),viewer=document.getElementById('viewer'),big=document.getElementById('big'),counter=document.getElementById('counter'),finale=document.getElementById('finale'),fx=document.getElementById('fx'),trails=document.getElementById('trails');let current=0,tiles=[],slots=[],scatter=[];
function atmosphere(){const stars=document.getElementById('stars'),petals=document.getElementById('petals'),butterflies=document.getElementById('butterflies');stars.innerHTML='';petals.innerHTML='';butterflies.innerHTML='';for(let i=0;i<(innerWidth<620?45:80);i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.setProperty('--dur',(2+Math.random()*3)+'s');s.style.animationDelay=(-Math.random()*3)+'s';stars.appendChild(s)}for(let i=0;i<24;i++){const p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.top=(-Math.random()*90)+'vh';p.style.setProperty('--drift',(Math.random()*180-90)+'px');p.style.animationDuration=(9+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*16)+'s';petals.appendChild(p)}for(let i=0;i<10;i++){const b=document.createElement('i');b.className='bfly';b.style.left=(6+Math.random()*88)+'vw';b.style.top=(10+Math.random()*75)+'vh';b.style.animationDuration=(5+Math.random()*5)+'s';b.style.animationDelay=(-Math.random()*4)+'s';butterflies.appendChild(b)}}
function burst(x,y,n=18){for(let i=0;i<n;i++){const s=document.createElement('i');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*Math.PI*2,d=30+Math.random()*90;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');fx.appendChild(s);setTimeout(()=>s.remove(),1800)}}
function bSlots(){let best=null;for(let cols=14;cols<=21;cols++)for(let rows=22;rows<=30;rows++){const c=document.createElement('canvas');c.width=cols*34;c.height=rows*34;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font=`700 ${Math.floor(c.height*.92)}px Georgia, Times New Roman, serif`;x.fillText('B',c.width*.47,c.height*.5);const d=x.getImageData(0,0,c.width,c.height).data,pts=[];for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const px=Math.floor((col+.5)*34),py=Math.floor((r+.5)*34);if(d[(py*c.width+px)*4+3]>55)pts.push({col,row:r})}if(pts.length>=100){const score=Math.abs(pts.length-112)+cols*.2;if(!best||score<best.score)best={pts,cols,rows,score}}}const chosen=[];for(let i=0;i<100;i++)chosen.push(best.pts[Math.round(i*(best.pts.length-1)/99)]);return chosen}
function calcSlots(){const cells=bSlots(),sw=stage.clientWidth,sh=stage.clientHeight,minCol=Math.min(...cells.map(p=>p.col)),maxCol=Math.max(...cells.map(p=>p.col)),minRow=Math.min(...cells.map(p=>p.row)),maxRow=Math.max(...cells.map(p=>p.row)),usedCols=maxCol-minCol+1,usedRows=maxRow-minRow+1,cw=sw/usedCols,ch=sh/usedRows,cell=Math.max(24,Math.min(cw,ch)*.9);slots=cells.map(p=>({x:(p.col-minCol)*cw+(cw-cell)/2,y:(p.row-minRow)*ch+(ch-cell)/2,w:cell,h:cell}));scatter=photos.map(()=>({x:Math.random()*(sw-70),y:Math.random()*(sh-55),w:44+Math.random()*24,h:34+Math.random()*20,rot:Math.random()*40-20}))}
function createTiles(){box.innerHTML='';tiles=[];photos.forEach((src,i)=>{const b=document.createElement('button');b.className='memory';b.type='button';const im=document.createElement('img');im.src=src;im.alt='Original memory '+(i+1);im.loading=i<35?'eager':'lazy';b.appendChild(im);b.onclick=()=>openViewer(i,b);box.appendChild(b);tiles.push(b)})}
function scatterNow(){tiles.forEach((b,i)=>{const p=scatter[i];b.classList.remove('float');b.style.transition='left .8s ease,top .8s ease,width .8s ease,height .8s ease,transform .8s ease';b.style.left=p.x+'px';b.style.top=p.y+'px';b.style.width=p.w+'px';b.style.height=p.h+'px';b.style.transform=`rotate(${p.rot}deg) scale(.96)`})}
function formB(){tiles.forEach((b,i)=>{const p=slots[i],rot=(Math.random()*5-2.5).toFixed(2)+'deg';b.style.transition=`left ${700+i*4}ms cubic-bezier(.2,.8,.2,1),top ${700+i*4}ms cubic-bezier(.2,.8,.2,1),width ${700+i*4}ms cubic-bezier(.2,.8,.2,1),height ${700+i*4}ms cubic-bezier(.2,.8,.2,1),transform ${700+i*4}ms cubic-bezier(.2,.8,.2,1)`;b.style.left=p.x+'px';b.style.top=p.y+'px';b.style.width=p.w+'px';b.style.height=p.h+'px';b.style.setProperty('--rot',rot);b.style.setProperty('--fx',(Math.random()*6-3)+'px');b.style.setProperty('--fy',(Math.random()*8-4)+'px');b.style.setProperty('--fdur',(3+Math.random()*2)+'s');b.style.transform=`rotate(${rot})`;setTimeout(()=>b.classList.add('float'),900+i*3)})}
function wildBloom(){calcSlots();scatterNow();burst(innerWidth/2,innerHeight/2,34);setTimeout(formB,220)}
function openViewer(i,tile){current=(i+photos.length)%photos.length;const r=tile.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,20);big.src=photos[current];counter.textContent=String(current+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');viewer.classList.add('show');viewer.setAttribute('aria-hidden','false')}
function closeViewer(){viewer.classList.remove('show');viewer.setAttribute('aria-hidden','true')}
function build(){calcSlots();createTiles();scatterNow();setTimeout(formB,180)}
document.getElementById('enter').onclick=()=>{gate.classList.add('hide');app.classList.add('ready');build()};document.getElementById('wildBtn').onclick=wildBloom;document.getElementById('close').onclick=closeViewer;document.getElementById('prev').onclick=()=>openViewer(current-1,tiles[(current-1+tiles.length)%tiles.length]);document.getElementById('next').onclick=()=>openViewer(current+1,tiles[(current+1)%tiles.length]);document.getElementById('finalBtn').onclick=()=>{burst(innerWidth/2,innerHeight/2,50);finale.classList.add('show')};document.getElementById('again').onclick=()=>{finale.classList.remove('show');setTimeout(wildBloom,120)};viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});let sx=0;viewer.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45){const ni=current+(dx<0?1:-1);openViewer(ni,tiles[(ni+tiles.length)%tiles.length])}},{passive:true});addEventListener('mousemove',e=>{const r=stage.getBoundingClientRect(),dx=((e.clientX-r.left)/r.width-.5),dy=((e.clientY-r.top)/r.height-.5);stage.style.transform=`rotateX(${dy*-4}deg) rotateY(${dx*5}deg)`;const t=document.createElement('i');t.className='trail';t.style.left=e.clientX+'px';t.style.top=e.clientY+'px';trails.appendChild(t);setTimeout(()=>t.remove(),800)});let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{atmosphere();build()},160)});atmosphere();})();
</script>
</body>
</html>
