<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BEAUX Memory Gallery</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ee;font-family:Arial,sans-serif;color:#24211f}body{touch-action:none}#app{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 45%,#fff 0,#f7f4ee 58%,#eee6dd 100%)}header{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:9;font-size:12px;font-weight:800;letter-spacing:.14em}#stage{position:absolute;inset:60px 0 84px;perspective:1000px;overflow:hidden}#g{position:absolute;inset:0;transform-style:preserve-3d}.m{position:absolute;left:50%;top:50%;width:120px;height:150px;padding:6px;border:0;background:#fff;border-radius:45%;box-shadow:0 18px 38px #0002;overflow:hidden;transition:.25s}.m img{width:100%;height:100%;object-fit:cover;border-radius:42%;pointer-events:none}#c{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:10}.ctrl{min-height:50px;padding:0 15px;border:1px solid #0002;border-radius:999px;background:#ffffffdd;font-weight:800}#camw{position:absolute;right:12px;top:58px;width:100px;aspect-ratio:4/3;border-radius:15px;overflow:hidden;display:none;z-index:12;background:#111}#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#f{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:#f3e7dc;z-index:20}#f h1{font:500 52px Georgia,serif;margin:0 0 14px;color:#624b3f}#f p{max-width:520px;line-height:1.7;color:#68564b}</style></head><body><div id="app"><header><span>BEAUX // MEMORY GALLERY</span><span id="s">TOUCH MODE</span></header><div id="stage"><div id="g"></div></div><div id="camw"><video id="cam" autoplay muted playsinline></video></div><div id="c"><button class="ctrl" id="camBtn">ENABLE HAND CONTROL</button><button class="ctrl" id="grid">MEMORY WALL</button><button class="ctrl" id="rnd">SURPRISE</button><button class="ctrl" id="fin">♥</button></div><div id="f"><div><h1>Happy Birthday, Beaux.</h1><p>No matter how many miles or years pass, you will always be my sister and one of my favorite parts of home. I hope this year gives you more reasons to smile, dream, and make beautiful memories. Love you always.</p><button class="ctrl" id="again">PLAY AGAIN</button></div></div></div><script>const photos=['https://picsum.photos/seed/beaux1/500/650','https://picsum.photos/seed/beaux2/500/650','https://picsum.photos/seed/beaux3/500/650','https://picsum.photos/seed/beaux4/500/650','https://picsum.photos/seed/beaux5/500/650','https://picsum.photos/seed/beaux6/500/650','https://picsum.photos/seed/beaux7/500/650','https://picsum.photos/seed/beaux8/500/650'];let a=0,grid=false,cards=[],drag=false,sx=0,sa=0,stream=null,timer=null,last=.5;const g=document.querySelector('#g'),stage=document.querySelector('#stage'),status=document.querySelector('#s');photos.sort(()=>Math.random()-.5).forEach((p,i)=>{let b=document.createElement('button');b.className='m';b.innerHTML='<img src="'+p+'" alt="Birthday memory">';b.onclick=()=>{grid=false;render();b.style.transform='translate(-50%,-50%) translateZ(240px) scale(1.7)';b.style.zIndex=99};g.appendChild(b);cards.push(b)});function render(){cards.forEach((c,i)=>{if(grid){let col=i%4,row=Math.floor(i/4);c.style.transform='translate(-50%,-50%) translate('+((col-1.5)*95)+'px,'+((row-.5)*155)+'px) scale(.68)';c.style.opacity=1}else{let t=i/cards.length*Math.PI*2+a,x=Math.cos(t)*Math.min(innerWidth*.32,260),y=Math.sin(t)*Math.min(innerHeight*.25,180),d=(Math.sin(t)+1)/2;c.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) translateZ('+(d*140-70)+'px) scale('+(0.7+d*.35)+')';c.style.opacity=.5+d*.5;c.style.zIndex=Math.round(d*50)}})}render();stage.onpointerdown=e=>{drag=true;sx=e.clientX;sa=a;stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(drag&&!grid){a=sa+(e.clientX-sx)*.01;render()}};stage.onpointerup=()=>drag=false;document.querySelector('#grid').onclick=()=>{grid=!grid;status.textContent=grid?'MEMORY WALL':'TOUCH MODE';render()};document.querySelector('#rnd').onclick=()=>cards[Math.floor(Math.random()*cards.length)].click();document.querySelector('#fin').onclick=()=>document.querySelector('#f').style.display='grid';document.querySelector('#again').onclick=()=>document.querySelector('#f').style.display='none';document.querySelector('#camBtn').onclick=async()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;document.querySelector('#camw').style.display='none';status.textContent='TOUCH MODE';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});let v=document.querySelector('#cam');v.srcObject=stream;await v.play();document.querySelector('#camw').style.display='block';status.textContent='HAND CONTROL ACTIVE';let cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});cv.width=64;cv.height=48;let prev=null;timer=setInterval(()=>{if(!stream||v.readyState<2||grid)return;x.save();x.scale(-1,1);x.drawImage(v,-64,0,64,48);x.restore();let d=x.getImageData(0,0,64,48).data;if(prev){let sx=0,w=0;for(let yy=4;yy<44;yy+=2)for(let xx=3;xx<61;xx+=2){let k=(yy*64+xx)*4,df=Math.abs(d[k]-prev[k])+Math.abs(d[k+1]-prev[k+1])+Math.abs(d[k+2]-prev[k+2]);if(df>90){sx+=xx*df;w+=df}}if(w>22000){let hx=sx/w/64,delta=hx-last;if(Math.abs(delta)>.015){a+=delta*1.9;render()}last=hx}}prev=new Uint8ClampedArray(d)},100)}catch(e){status.textContent='CAMERA PERMISSION NEEDED'}};</script></body></html>
