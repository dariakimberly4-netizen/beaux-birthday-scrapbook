<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09020e">
<title>BEAUX — THE QUEEN B</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09020e}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#09020e}
</style>
</head>
<body>
<iframe id="crownFrame" src="crown-100.html?viewer=nav4" title="Beaux 100-Piece Crown"></iframe>
<script>
const frame=document.getElementById('crownFrame');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!d)return;
  const modal=d.getElementById('memoryModal');
  const card=d.querySelector('#memoryModal .memoryCard');
  const photo=d.getElementById('memoryPhoto');
  if(!modal||!card||!photo)return;

  const oldCopy=card.querySelector('.memoryCopy');
  if(oldCopy)oldCopy.remove();

  const style=d.createElement('style');
  style.textContent=`
    #memoryModal .memoryCard{grid-template-columns:1fr!important;width:min(940px,95vw)!important;background:#070109!important;position:relative!important;overflow:hidden!important}
    #memoryModal .memoryPhoto{display:block!important;width:100%!important;height:min(82vh,760px)!important;max-height:82vh!important;object-fit:contain!important;background:#070109!important}
    .memoryNav{position:absolute;left:0;right:0;bottom:14px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
    .memoryNav button{pointer-events:auto;min-width:118px;min-height:52px;border:1px solid rgba(255,229,161,.9);border-radius:999px;background:rgba(10,2,16,.82);backdrop-filter:blur(10px);color:#fff3c6;font-weight:900;font-size:12px;letter-spacing:.12em;cursor:pointer;box-shadow:0 0 24px rgba(255,210,105,.18)}
    .memoryNav button:active{transform:scale(.97)}
    .memoryCounter{pointer-events:none;color:#ffe29a;font:700 12px/1 Georgia,serif;letter-spacing:.14em;text-shadow:0 0 18px rgba(0,0,0,.8)}
    @media(max-width:620px){#memoryModal .memoryPhoto{height:78vh!important;max-height:78vh!important}.memoryNav{padding:0 10px;bottom:10px}.memoryNav button{min-width:104px;min-height:50px;font-size:11px}.memoryCounter{font-size:11px}}
  `;
  d.head.appendChild(style);

  const nav=d.createElement('div');
  nav.className='memoryNav';
  nav.innerHTML='<button type="button" id="memoryBack">← BACK</button><div class="memoryCounter" id="memoryCounter">01 / 100</div><button type="button" id="memoryNext">NEXT →</button>';
  card.appendChild(nav);

  const back=nav.querySelector('#memoryBack');
  const next=nav.querySelector('#memoryNext');
  const counter=nav.querySelector('#memoryCounter');
  const photos=(w.BEAUX_PHOTOS||[]).slice(0,100);
  let index=0;

  function findCurrent(){
    const src=photo.getAttribute('src')||'';
    const found=photos.findIndex(p=>src===p||src.includes(p));
    if(found>=0)index=found;
  }
  function show(i){
    if(!photos.length)return;
    index=(i+photos.length)%photos.length;
    photo.src=photos[index];
    counter.textContent=String(index+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');
  }
  back.addEventListener('click',e=>{e.stopPropagation();findCurrent();show(index-1)});
  next.addEventListener('click',e=>{e.stopPropagation();findCurrent();show(index+1)});

  const observer=new MutationObserver(()=>{if(modal.classList.contains('show')){findCurrent();counter.textContent=String(index+1).padStart(2,'0')+' / '+String(photos.length||100).padStart(2,'0')}});
  observer.observe(modal,{attributes:true,attributeFilter:['class']});

  d.addEventListener('keydown',e=>{
    if(!modal.classList.contains('show'))return;
    if(e.key==='ArrowLeft'){e.preventDefault();findCurrent();show(index-1)}
    if(e.key==='ArrowRight'){e.preventDefault();findCurrent();show(index+1)}
  });

  let x0=null;
  photo.addEventListener('touchstart',e=>{x0=e.touches[0]?.clientX??null},{passive:true});
  photo.addEventListener('touchend',e=>{
    if(x0==null)return;
    const x1=e.changedTouches[0]?.clientX??x0,dx=x1-x0;
    if(Math.abs(dx)>45){findCurrent();show(index+(dx<0?1:-1))}
    x0=null;
  },{passive:true});
});
</script>
</body>
</html>
