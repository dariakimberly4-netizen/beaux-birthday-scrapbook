<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BEAUX — Center Flower Memory Garden</title><style>:root{--bg:#061009;--cream:#f8e8c7;--gold:#d9af6b;--pink:#f2a7b7}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 48%,#1a2a1e 0,#0b1710 38%,#050b07 68%,#020403 100%);color:var(--cream);font-family:Arial,sans-serif}button,input{font:inherit}.hidden{display:none!important}#lock{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle,#1b2b1f 0,#08100b 48%,#020403 100%)}.card{width:min(430px,92vw);text-align:center}.dogs{width:min(310px,78vw);height:245px;object-fit:cover;border-radius:30px;border:2px solid rgba(217,175,107,.8);box-shadow:0 22px 70px rgba(0,0,0,.55);display:block;margin:0 auto 20px}.card h1{margin:0;font:52px Georgia,serif;letter-spacing:10px}.card p{opacity:.82}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.row input{width:210px;padding:14px 18px;border-radius:999px;border:1px solid var(--gold);text-align:center;letter-spacing:2px;outline:none}.row button,.chip{border:1px solid rgba(217,175,107,.85);border-radius:999px;padding:13px 20px;background:var(--gold);color:#111;font-weight:700;cursor:pointer}.err{height:22px;margin-top:10px;color:#ffb8c3}#app{position:fixed;inset:0;overflow:hidden}header{position:fixed;z-index:100;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;pointer-events:none}.brand{font:700 14px Georgia,serif;letter-spacing:3px;pointer-events:auto}.controls{display:flex;gap:8px;pointer-events:auto}.chip{background:rgba(8,16,11,.72);color:var(--cream);padding:9px 13px;font-size:12px;backdrop-filter:blur(8px)}#scene{position:absolute;inset:0;overflow:hidden}#swarm{position:absolute;inset:0}#halo{position:absolute;left:50%;top:50%;width:min(780px,90vw);height:min(780px,90vw);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,221,231,.11),rgba(255,210,225,.045) 38%,transparent 70%);pointer-events:none}#center{position:absolute;left:50%;top:50%;width:390px;height:390px;transform:translate(-50%,-50%);z-index:50;cursor:pointer;animation:centerFloat 5s ease-in-out infinite}@keyframes centerFloat{50%{transform:translate(-50%,-50%) translateY(-10px)}}.cp{position:absolute;left:50%;top:50%;width:132px;height:205px;margin:-102px 0 0 -66px;border-radius:72% 72% 46% 46%;transform-origin:50% 92%;background:radial-gradient(circle at 44% 25%,#fff4f6 0,#ffd9e1 22%,#f0a1b1 62%,#d97b91 100%);box-shadow:inset 0 0 20px rgba(255,255,255,.28),0 8px 28px rgba(242,167,183,.18)}.cp:nth-child(1){transform:rotate(0deg) translateY(-112px)}.cp:nth-child(2){transform:rotate(45deg) translateY(-112px)}.cp:nth-child(3){transform:rotate(90deg) translateY(-112px)}.cp:nth-child(4){transform:rotate(135deg) translateY(-112px)}.cp:nth-child(5){transform:rotate(180deg) translateY(-112px)}.cp:nth-child(6){transform:rotate(225deg) translateY(-112px)}.cp:nth-child(7){transform:rotate(270deg) translateY(-112px)}.cp:nth-child(8){transform:rotate(315deg) translateY(-112px)}#centerImg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:215px;height:286px;object-fit:contain;background:#080b09;padding:4px;border-radius:26px;border:4px solid #f9d6df;box-shadow:0 0 0 5px rgba(217,175,107,.82),0 18px 55px rgba(0,0,0,.48);z-index:5}.tiny{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;z-index:12;cursor:pointer;will-change:transform;filter:drop-shadow(0 6px 9px rgba(0,0,0,.28))}.tp{position:absolute;left:50%;top:50%;width:16px;height:23px;margin:-11px 0 0 -8px;border-radius:70% 70% 45% 45%;transform-origin:50% 88%;background:radial-gradient(circle at 40% 25%,#fff0f4 0,#ffd6df 25%,#f0a2b3 60%,#d97b91 100%)}.tp:nth-child(1){transform:rotate(0deg) translateY(-11px)}.tp:nth-child(2){transform:rotate(60deg) translateY(-11px)}.tp:nth-child(3){transform:rotate(120deg) translateY(-11px)}.tp:nth-child(4){transform:rotate(180deg) translateY(-11px)}.tp:nth-child(5){transform:rotate(240deg) translateY(-11px)}.tp:nth-child(6){transform:rotate(300deg) translateY(-11px)}.mini{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:27px;height:33px;border-radius:8px;overflow:hidden;border:2px solid #f8cad4;box-shadow:0 0 0 2px rgba(217,175,107,.85);background:#08100b;z-index:5}.mini img{width:100%;height:100%;object-fit:cover;display:block}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#f7cc74;box-shadow:0 0 10px #f7cc74;opacity:.7;animation:spark 7s linear infinite;pointer-events:none}@keyframes spark{from{transform:translateY(40px);opacity:0}20%{opacity:.8}to{transform:translateY(-160px);opacity:0}}#note{position:fixed;z-index:100;bottom:16px;left:50%;transform:translateX(-50%);text-align:center;width:min(90vw,620px);pointer-events:none}#note strong{display:block;font:20px Georgia,serif}#note span{font-size:13px;opacity:.8}#viewer{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(0,0,0,.9);backdrop-filter:blur(10px)}#viewer.show{display:flex}#viewer img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:24px;border:2px solid rgba(217,175,107,.75);background:#050706;box-shadow:0 24px 90px #000}#close{position:absolute;right:18px;top:18px;width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);background:#111;color:white;font-size:28px;cursor:pointer}.paused *{animation-play-state:paused!important}@media(max-width:700px){.brand{font-size:10px;max-width:58%}.chip{font-size:10px;padding:8px 10px}#center{width:250px;height:250px}.cp{width:84px;height:126px;margin:-63px 0 0 -42px}.cp:nth-child(1){transform:rotate(0) translateY(-73px)}.cp:nth-child(2){transform:rotate(45deg) translateY(-73px)}.cp:nth-child(3){transform:rotate(90deg) translateY(-73px)}.cp:nth-child(4){transform:rotate(135deg) translateY(-73px)}.cp:nth-child(5){transform:rotate(180deg) translateY(-73px)}.cp:nth-child(6){transform:rotate(225deg) translateY(-73px)}.cp:nth-child(7){transform:rotate(270deg) translateY(-73px)}.cp:nth-child(8){transform:rotate(315deg) translateY(-73px)}#centerImg{width:132px;height:178px}.tiny{width:34px;height:34px;margin:-17px}.tp{width:12px;height:17px;margin:-8px 0 0 -6px}.tp:nth-child(1){transform:rotate(0) translateY(-8px)}.tp:nth-child(2){transform:rotate(60deg) translateY(-8px)}.tp:nth-child(3){transform:rotate(120deg) translateY(-8px)}.tp:nth-child(4){transform:rotate(180deg) translateY(-8px)}.tp:nth-child(5){transform:rotate(240deg) translateY(-8px)}.tp:nth-child(6){transform:rotate(300deg) translateY(-8px)}.mini{width:20px;height:24px;border-radius:6px}#note strong{font-size:16px}#note span{font-size:11px}}</style></head><body><section id="lock"><div class="card"><img class="dogs" src="assets/photos/IMG-20260728-WA0000.jpg" alt="Two dogs"><h1>BEAUX</h1><p>One flower. A hundred memories.</p><form id="form"><div class="row"><input id="pass" type="password" placeholder="PASSWORD" autocomplete="off"><button type="submit">ENTER</button></div></form><div id="err" class="err"></div></div></section><section id="app"><header><div class="brand">BEAUX — CENTER FLOWER MEMORY GARDEN</div><div class="controls"><button id="pause" class="chip">PAUSE</button><button id="wild" class="chip">WILDER</button></div></header><div id="scene"><div id="halo"></div><div id="swarm"></div><div id="center"><div class="cp"></div><div class="cp"></div><div class="cp"></div><div class="cp"></div><div class="cp"></div><div class="cp"></div><div class="cp"></div><div class="cp"></div><img id="centerImg" alt="Featured birthday photo"></div></div><div id="note"><strong>One flower at the center.</strong><span>100 tiny memory flowers move around it — tap any flower to open the photo.</span></div></section><div id="viewer"><button id="close">×</button><img id="viewImg" alt="Memory"></div><script>const lock=document.getElementById('lock'),form=document.getElementById('form'),pass=document.getElementById('pass'),err=document.getElementById('err'),swarm=document.getElementById('swarm'),centerImg=document.getElementById('centerImg'),viewer=document.getElementById('viewer'),viewImg=document.getElementById('viewImg');let ids=[],items=[],started=false,paused=false,wild=1,start=0;form.addEventListener('submit',e=>{e.preventDefault();if(pass.value.trim().toUpperCase()==='BEAUX'){lock.classList.add('hidden');boot()}else err.textContent='Try BEAUX ✦'});function openPhoto(src){viewImg.src=src;viewer.classList.add('show')}function closePhoto(){viewer.classList.remove('show');viewImg.src=''}document.getElementById('close').onclick=closePhoto;viewer.onclick=e=>{if(e.target===viewer)closePhoto()};document.onkeydown=e=>{if(e.key==='Escape')closePhoto()};document.getElementById('center').onclick=()=>openPhoto(centerImg.src);document.getElementById('pause').onclick=e=>{paused=!paused;document.body.classList.toggle('paused',paused);e.target.textContent=paused?'RESUME':'PAUSE'};document.getElementById('wild').onclick=e=>{wild=wild===1?1.8:wild===1.8?2.7:1;e.target.textContent=wild===1?'WILDER':wild===1.8?'WILDEST':'CALM'};async function getCenter(){try{const t=await fetch('flower-bloom-center-v3.html?v=source').then(r=>r.text());const m=t.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(m)centerImg.src=m[0];else centerImg.src='assets/photos/IMG-20260903-WA0085.jpg'}catch{centerImg.src='assets/photos/IMG-20260903-WA0085.jpg'}}async function getIds(){try{const t=await fetch('flower-bloom-final.html?v=source').then(r=>r.text());const m=t.match(/const DRIVE_IDS\s*=\s*(\[[\s\S]*?\]);/);if(m){ids=JSON.parse(m[1]);ids=ids.slice(0,100)}}catch{}if(!ids.length){ids=['1-QVlGgM0BqfcUQqWcQLNPlzoDztmzcpg','1ONzcyGleKAL39Wl3BP4JHSF04wpkuUxT','1_-ca47E29UUEVxlmK64GAN_tZ4YQfbaP','1L9YqKXnmXQx6j-xS2dp6QvOfu4oHi1q7','1SMMWYdG0DtjnhH_u9KYqBRS_eNX4Ls2l','19hKTEOxavIecIMoJbimuODSOJXK-4Np6','1Yxjpv34EWj758TA_FuRB4_R1RHGeZ6eL','1frYwatctg6od3LQhvl3atnZTjDDCNAxP','1HBeZ7kuMR_OXKO3IaZOTlFnsIcV16mOu','14sTEaEBPn5nxEUrV1Nh_c6DVkUp5SItR'];while(ids.length<100)ids=ids.concat(ids);ids=ids.slice(0,100)}}function url(id){return'https://drive.google.com/thumbnail?id='+id+'&sz=w600'}function makeFlower(id,i){const el=document.createElement('div');el.className='tiny';el.innerHTML='<i class="tp"></i><i class="tp"></i><i class="tp"></i><i class="tp"></i><i class="tp"></i><i class="tp"></i><span class="mini"><img loading="lazy" src="'+url(id)+'"></span>';el.onclick=e=>{e.stopPropagation();openPhoto(url(id))};swarm.appendChild(el);const mobile=innerWidth<700,ring=i%5,base=mobile?145:250,gap=mobile?42:72,r=base+ring*gap+(i%7)*3,a=i*2.3999632297,s=(ring%2?-.00009:.0001)*(1+ring*.10),amp=(mobile?5:8)+(i%6);items.push({el,r,a,s,amp,phase:i*.73,ys:mobile?.70:.76})}function sparks(){for(let i=0;i<50;i++){const s=document.createElement('b');s.className='spark';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDuration=5+Math.random()*9+'s';s.style.animationDelay=Math.random()*7+'s';swarm.appendChild(s)}}function animate(ts){if(!start)start=ts;const t=ts-start;if(!paused){items.forEach((o,i)=>{const a=o.a+t*o.s*wild,r=o.r*(1+.025*Math.sin(t*.00035+i)),x=Math.cos(a)*r+Math.sin(t*.0012+o.phase)*o.amp*wild,y=Math.sin(a)*r*o.ys+Math.cos(t*.001+o.phase)*o.amp*.7*wild;o.el.style.transform='translate('+x+'px,'+y+'px) rotate('+(Math.sin(t*.0004+i)*7*wild)+'deg)'})}requestAnimationFrame(animate)}async function boot(){if(started)return;started=true;await Promise.all([getCenter(),getIds()]);ids.forEach(makeFlower);sparks();requestAnimationFrame(animate)};</script></body></html>
