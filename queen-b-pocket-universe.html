<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Queen B's Pocket Universe</title><style>
:root{--gold:#f3d37b;--cream:#fff3d7;--deep:#090511;--violet:#5b2a78}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit}.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 22%,#3d1554 0,#160a22 38%,#05030a 78%)}.stars,.stars:after{position:absolute;inset:-20%;content:"";background-image:radial-gradient(#fff 0 1px,transparent 1.5px),radial-gradient(#f6d88d 0 1px,transparent 1.4px);background-size:78px 78px,119px 119px;background-position:0 0,37px 53px;opacity:.55;animation:drift 24s linear infinite}@keyframes drift{to{transform:translate3d(-70px,40px,0)}}.intro{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2e113c,#0a0510 66%);transition:opacity 1.1s,transform 1.2s}.intro.gone{opacity:0;pointer-events:none;transform:scale(1.7)}.introBox{text-align:center}.intro h1{margin:0;color:var(--cream);font:500 clamp(32px,6vw,70px)/.92 Georgia,serif}.intro p{max-width:600px;margin:16px auto 26px;color:#d9ccdc;font:15px/1.6 Georgia,serif}.jewelBox{position:relative;width:min(310px,72vw);height:210px;margin:0 auto 20px;perspective:1000px;cursor:pointer}.base{position:absolute;left:50%;bottom:18px;width:78%;height:98px;transform:translateX(-50%);border-radius:18px 18px 30px 30px;background:linear-gradient(145deg,#5b1d55,#2d0f38 60%,#120818);border:2px solid #d9b861;box-shadow:0 25px 50px #0008, inset 0 0 25px #ffffff0d}.lid{position:absolute;left:50%;top:22px;width:80%;height:90px;transform-origin:50% 100%;transform:translateX(-50%) rotateX(0deg);border-radius:38px 38px 18px 18px;background:linear-gradient(145deg,#6a265e,#32113f 60%,#16081d);border:2px solid #e3c66e;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}.jewelBox.open .lid{transform:translateX(-50%) rotateX(-112deg)}.cosmos{position:absolute;left:50%;bottom:62px;width:130px;height:70px;transform:translateX(-50%) scale(.3);border-radius:50%;background:radial-gradient(circle,#fff9c9 0 2%,#9ae8ff 9%,#b361e1 25%,#27113a 56%,transparent 70%);filter:blur(.5px);opacity:0;transition:.8s .25s;box-shadow:0 0 40px #d88cff,0 0 90px #f7d67288}.jewelBox.open .cosmos{opacity:1;transform:translateX(-50%) scale(1)}.enter{min-height:54px;padding:0 28px;border-radius:999px;border:1px solid #f7df9b;background:linear-gradient(135deg,#ffeab1,#d7ab50);color:#1a0b18;font-weight:900;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.universe{position:absolute;inset:0;opacity:0;transform:scale(.65);pointer-events:none;transition:1.3s cubic-bezier(.18,.9,.2,1)}.universe.on{opacity:1;transform:scale(1);pointer-events:auto}.titlebar{position:absolute;z-index:8;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;align-items:center}.brand{font:700 10px/1 Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#e7c96f}.progress{font:600 12px/1 Georgia,serif;color:#f2d37b}.core{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fffbd0 0 3%,#8be8ff 9%,#c26be4 24%,#5d2786 42%,#160920 69%,transparent 72%);box-shadow:0 0 55px #b260e4aa,0 0 130px #5bcbe744;animation:core 5s ease-in-out infinite}@keyframes core{50%{transform:translate(-50%,-50%) scale(1.08)}}.orbit{position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);transform:translate(-50%,-50%);border:1px solid #ffffff12;border-radius:50%;animation:spin var(--dur) linear infinite}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}.world{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:var(--s);height:var(--s);border-radius:50%;border:1px solid #f2d89f55;background:radial-gradient(circle at 35% 30%,#fff7c4 0 4%,var(--c1) 18%,var(--c2) 58%,#100516 100%);box-shadow:0 0 22px var(--glow);cursor:pointer;display:grid;place-items:center;color:#fff6d6;font-size:22px}.world::after{content:attr(data-label);position:absolute;top:calc(100% + 8px);white-space:nowrap;font:700 8px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#d9cbdc}.world.pulse{animation:pop .7s ease}@keyframes pop{50%{transform:translate(-50%,-50%) scale(1.28);box-shadow:0 0 40px #fff1a6}}.floatMemory{position:fixed;z-index:42;width:58px;height:44px;border:2px solid #f7df9e;border-radius:6px;overflow:hidden;background:#130818;box-shadow:0 0 18px #eac46d66;animation:floatIn 1.5s cubic-bezier(.16,.88,.18,1) forwards;pointer-events:none}.floatMemory img{width:100%;height:100%;object-fit:cover}@keyframes floatIn{from{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}to{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:1}}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(5,2,8,.88);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.3s}.modal.show{opacity:1;visibility:visible}.panel{width:min(880px,94vw);max-height:90vh;border-radius:28px;border:1px solid #f0d48655;background:linear-gradient(180deg,#2a1038ee,#0e0714f7);padding:24px;overflow:auto}.panel h2{margin:0 0 8px;color:#fff1cf;font:500 38px/1 Georgia,serif}.panel p{margin:0 0 18px;color:#d8ccda;font:14px/1.6 Georgia,serif}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.grid button{aspect-ratio:1/1;border-radius:14px;border:1px solid #f2d69744;background:#1a0c21;overflow:hidden;padding:0;cursor:pointer}.grid img{width:100%;height:100%;object-fit:cover}.close{float:right;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff33;background:#0d0712;color:#fff;font-size:24px;cursor:pointer}.videoStage{position:fixed;inset:0;z-index:60;background:#050208ee;display:grid;place-items:center;opacity:0;visibility:hidden;transition:.6s}.videoStage.show{opacity:1;visibility:visible}.videoShell{width:min(1100px,95vw);aspect-ratio:16/9;border-radius:26px;overflow:hidden;border:1px solid #f2d796aa;box-shadow:0 0 45px #f0cf7d44,0 0 120px #a65ee055;background:#000}.videoShell video{width:100%;height:100%;object-fit:contain}.finale{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#55236f,#0b0610 70%);opacity:0;visibility:hidden;transition:.5s}.finale.show{opacity:1;visibility:visible}.finale h2{margin:0;color:#fff2d1;font:500 clamp(44px,8vw,92px)/.9 Georgia,serif}.finale p{color:#e2d3e5;font:16px/1.6 Georgia,serif}.reset{min-height:46px;padding:0 20px;border-radius:999px;border:1px solid #f2d89b;background:#180b20;color:#fff0cf;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.orbit[data-o="4"],.orbit[data-o="5"]{display:none}.core{width:120px;height:120px}.world{font-size:18px}.titlebar{top:10px}.brand{font-size:8px}.progress{font-size:11px}.panel{padding:18px}.panel h2{font-size:32px}}
</style></head><body><main class="scene"><div class="stars"></div>
<section class="intro" id="intro"><div class="introBox"><h1>Queen B’s<br>Pocket Universe</h1><p>Some universes are too beautiful to stay small.</p><div class="jewelBox" id="jewelBox"><div class="lid"></div><div class="cosmos"></div><div class="base"></div></div><button class="enter" id="enter">Open the box</button></div></section>
<section class="universe" id="universe"><div class="titlebar"><div class="brand">Queen B’s Pocket Universe</div><div class="progress" id="progress">0 / 100 memories</div></div><div class="core"></div>
<div class="orbit" data-o="1" style="--d:min(320px,62vw);--dur:22s"><button class="world" data-world="0" data-label="Star Globe" style="--s:72px;--c1:#8ce6ff;--c2:#4f2f91;--glow:#6fdfff88">✦</button></div>
<div class="orbit" data-o="2" style="--d:min(470px,82vw);--dur:32s"><button class="world" data-world="1" data-label="Moon Garden" style="--s:68px;--c1:#ffd991;--c2:#7a457a;--glow:#ffd99177">☾</button></div>
<div class="orbit" data-o="3" style="--d:min(610px,102vw);--dur:40s"><button class="world" data-world="2" data-label="Wish Bottle" style="--s:64px;--c1:#ffc0da;--c2:#71305e;--glow:#ff9fcf77">✉</button></div>
<div class="orbit" data-o="4" style="--d:min(760px,125vw);--dur:50s"><button class="world" data-world="3" data-label="Music Box" style="--s:60px;--c1:#c2b1ff;--c2:#41306e;--glow:#b9a7ff77">♫</button></div>
<div class="orbit" data-o="5" style="--d:min(910px,145vw);--dur:62s"><button class="world" data-world="4" data-label="Mirror World" style="--s:58px;--c1:#a9f2ff;--c2:#355867;--glow:#a9f2ff77">◇</button></div>
</section></main>
<div class="modal" id="modal"><div class="panel"><button class="close" id="close">×</button><h2 id="worldTitle">Memory World</h2><p id="worldCopy">Open memories hidden inside this world.</p><div class="grid" id="grid"></div></div></div>
<div class="videoStage" id="videoStage"><div class="videoShell"><video id="video" playsinline controls preload="metadata" src="assets/VID-20260915-WA0000.mp4"></video></div></div>
<div class="finale" id="finale"><div><h2>Happy Birthday,<br>Queen B 👑</h2><p>Some people don’t just hold memories.<br>They hold entire universes.</p><button class="reset" id="reset">Replay the universe</button></div></div>
<script src="assets/memory-volcano-photos.js"></script><script>
const IDS=window.MEMORY_VOLCANO_IDS||[],thumb=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w500`,full=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
const intro=document.getElementById('intro'),box=document.getElementById('jewelBox'),enter=document.getElementById('enter'),universe=document.getElementById('universe'),progress=document.getElementById('progress'),modal=document.getElementById('modal'),grid=document.getElementById('grid'),worldTitle=document.getElementById('worldTitle'),worldCopy=document.getElementById('worldCopy'),close=document.getElementById('close'),videoStage=document.getElementById('videoStage'),video=document.getElementById('video'),finale=document.getElementById('finale'),reset=document.getElementById('reset');
const names=['Star Globe','Moon Garden','Wish Bottle','Music Box','Mirror World'],copies=['A tiny sky where memories become stars.','A moonlit garden where memories bloom.','Each wish releases another glowing memory.','Every note opens another moment.','A reflection made from the people and moments you love.'];
let state=JSON.parse(localStorage.getItem('queen_b_pocket_v1')||'[]');if(!Array.isArray(state)||state.length!==IDS.length)state=Array(IDS.length).fill(false);
let opened=false;
enter.onclick=()=>{if(!opened){opened=true;box.classList.add('open');enter.textContent='Enter the universe'}else{intro.classList.add('gone');setTimeout(()=>universe.classList.add('on'),450)}};
document.querySelectorAll('.world').forEach(b=>b.onclick=()=>openWorld(+b.dataset.world,b));
function openWorld(index,btn){btn.classList.add('pulse');setTimeout(()=>btn.classList.remove('pulse'),700);worldTitle.textContent=names[index];worldCopy.textContent=copies[index];grid.innerHTML='';const start=index*20,end=Math.min(start+20,IDS.length);for(let i=start;i<end;i++){const x=document.createElement('button');const img=document.createElement('img');img.src=thumb(IDS[i]);x.appendChild(img);x.onclick=()=>unlock(i,index,x);grid.appendChild(x)}modal.classList.add('show')}
function unlock(i,index,el){if(!state[i]){state[i]=true;localStorage.setItem('queen_b_pocket_v1',JSON.stringify(state));el.style.boxShadow='0 0 0 2px #f5d777,0 0 18px #f4d77788';flyMemory(i,index);update()}else{window.open(full(IDS[i]),'_blank')}}
function flyMemory(i,index){const r=document.querySelectorAll('.world')[index].getBoundingClientRect(),d=document.createElement('div');d.className='floatMemory';d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';const im=document.createElement('img');im.src=thumb(IDS[i]);d.appendChild(im);d.style.setProperty('--dx',(innerWidth/2-(r.left+r.width/2)+(Math.random()*120-60))+'px');d.style.setProperty('--dy',(innerHeight/2-(r.top+r.height/2)+(Math.random()*80-40))+'px');d.style.setProperty('--rot',(Math.random()*80-40)+'deg');document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function update(){const n=state.filter(Boolean).length;progress.textContent=`${n} / 100 memories`;if(n>=100)finalSequence()}
function finalSequence(){modal.classList.remove('show');setTimeout(()=>{videoStage.classList.add('show');video.currentTime=0;video.play().catch(()=>{})},900)}
video.onended=()=>{videoStage.classList.remove('show');finale.classList.add('show')};
close.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
reset.onclick=()=>{state=Array(IDS.length).fill(false);localStorage.removeItem('queen_b_pocket_v1');finale.classList.remove('show');videoStage.classList.remove('show');intro.classList.remove('gone');universe.classList.remove('on');box.classList.remove('open');opened=false;enter.textContent='Open the box';update()};
update();
</script></body></html>
