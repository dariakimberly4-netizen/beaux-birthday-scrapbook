<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BEAUX — Birthday Flower Bloom</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100b}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07100b}</style></head><body><iframe id="outer" src="flower-bloom-center-v2.html?v=3"></iframe><script>
(function(){
function patch(){
 try{
  const outer=document.getElementById('outer');
  const d1=outer.contentDocument;if(!d1)return;
  const inner=d1.getElementById('page')||d1.querySelector('iframe');
  const d=inner&&inner.contentDocument?inner.contentDocument:d1;
  if(!d)return;
  let st=d.getElementById('full-photo-fix');
  if(!st){st=d.createElement('style');st.id='full-photo-fix';st.textContent=`
   .flower{width:180px!important;height:210px!important}
   .center{width:104px!important;height:150px!important;border-radius:22px!important;background:#111!important;border:3px solid #edcc8e!important;box-shadow:0 0 30px #eecf8a77!important;overflow:hidden!important}
   .center img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;background:#111!important;display:block!important}
   .petal{z-index:0!important}.center{z-index:5!important}
   .flower.bloomed .center{transform:translate(-50%,-50%) scale(1)!important;opacity:1!important}
   @media(max-width:700px){.flower{width:150px!important;height:180px!important}.center{width:88px!important;height:128px!important}}
  `;d.head.appendChild(st)}
  d.querySelectorAll('.center img').forEach(img=>{img.style.objectFit='contain';img.style.objectPosition='center';img.style.background='#111';});
 }catch(e){}
}
setInterval(patch,400);window.addEventListener('load',()=>setTimeout(patch,500));
})();
</script></body></html>
