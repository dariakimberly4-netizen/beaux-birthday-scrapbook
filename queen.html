<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>BEAUX — The Queen B</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040c}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="queenFrame" src="queen-clean.html?v=20260915-exact-artwork" title="BEAUX — The Queen B"></iframe>
<script>
const f=document.getElementById('queenFrame');
f.addEventListener('load',()=>{
  try{
    const w=f.contentWindow;
    const d=f.contentDocument;
    if(!d)return;

    const style=d.createElement('style');
    style.id='exactArtworkMode';
    style.textContent=`
      .scene{background:url('assets/q.png?v=exact-woman') center/100% 100% no-repeat #05040c!important}
      .scene:before{display:none!important}
      .scene:after{display:none!important}
      .cover{display:none!important}
      .stage{left:46%!important;top:36.5%!important;width:46%!important;height:36%!important;background:transparent!important;box-shadow:none!important;border-radius:0!important;z-index:6!important}
      .shell{opacity:0!important;box-shadow:none!important;border:0!important;background:transparent!important}
      .memory{opacity:1!important;background:transparent!important;touch-action:manipulation!important}
      .memory:focus-visible{outline:2px solid rgba(255,224,139,.9)!important;outline-offset:2px!important;border-radius:8px!important}
      .finalHit{right:2.5%!important;top:1%!important;width:31%!important;height:5.2%!important;z-index:12!important}
      @media(max-width:760px){
        .scene{background-size:100% 100%!important;background-position:center!important}
        .stage{left:46%!important;top:36.5%!important;width:46%!important;height:36%!important}
        .memory{width:46px!important;height:46px!important}
        .finalHit{right:2.5%!important;top:1%!important;width:31%!important;height:5.2%!important}
      }
    `;
    d.head.appendChild(style);

    const old=d.getElementById('cleanPatch');
    if(old)old.remove();

    const stage=d.getElementById('stage');
    if(stage && typeof w.build==='function'){
      stage.innerHTML='';
      requestAnimationFrame(()=>w.build());
    }
  }catch(e){console.error('Queen artwork patch:',e)}
});
</script>
</body>
</html>
