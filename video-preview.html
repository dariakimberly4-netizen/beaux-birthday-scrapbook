<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09020e">
<title>BEAUX — Final Video Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:radial-gradient(circle at 50% 18%,#4e1464 0,#23062e 38%,#0a010f 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;padding:20px}.shell{width:min(980px,96vw);padding:16px;border:1px solid rgba(245,214,132,.5);border-radius:28px;background:#09020e;box-shadow:0 30px 100px rgba(0,0,0,.62),0 0 90px rgba(138,62,176,.28)}h1{text-align:center;color:#f5d98b;font:500 clamp(28px,5vw,50px)/1 Georgia,serif;margin:8px 12px 16px}.sub{text-align:center;color:#d9c8da;font-size:12px;letter-spacing:.08em;margin-bottom:14px}.videoWrap{position:relative;border-radius:20px;overflow:hidden;background:#000}.videoWrap video{display:block;width:100%;max-height:78vh;background:#000}.status{text-align:center;color:#d0c2d3;font-size:12px;margin:14px 0 4px}.back{display:block;width:min(300px,86%);margin:16px auto 0;min-height:54px;border:1px solid #ffe4a0;border-radius:999px;background:linear-gradient(135deg,#f9e7a8,#c78931);color:#170716;font-weight:900;letter-spacing:.12em;cursor:pointer}button{font:inherit}
</style>
</head>
<body>
<section class="shell">
<h1>THE FINAL BIRTHDAY VIDEO</h1>
<div class="sub">Direct preview — no need to finish all 100 crown pieces.</div>
<div class="videoWrap"><video id="video" controls playsinline preload="metadata"></video></div>
<div class="status" id="status">Preparing the video…</div>
<button class="back" type="button" onclick="location.href='queen-start.html?v=videopreview'">BACK TO QUEEN B</button>
</section>
<script>
const video=document.getElementById('video'),status=document.getElementById('status');
let videoUrl='';
async function loadVideo(){
 try{
   status.textContent='Opening the final video…';
   const parts=await Promise.all(Array.from({length:12},(_,i)=>fetch('assets/fall-video/part'+String(i).padStart(2,'0')+'.txt?v=video-preview-1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing video part '+i);return r.text()})));
   const b64=parts.map(s=>s.trim()).join('');
   const bin=atob(b64),bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
   videoUrl=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));
   video.src=videoUrl;
   status.textContent='Video ready — press Play.';
 }catch(err){
   console.error(err);
   status.textContent='The video could not load. Please refresh and try again.';
 }
}
loadVideo();
window.addEventListener('beforeunload',()=>{if(videoUrl)URL.revokeObjectURL(videoUrl)});
</script>
</body>
</html>
