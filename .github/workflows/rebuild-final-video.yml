name: Rebuild final birthday video

on:
  push:
    paths:
      - '.github/workflows/rebuild-final-video.yml'

permissions:
  contents: write

jobs:
  rebuild-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild MP4 from stored Base64 parts
        shell: bash
        run: |
          set -euo pipefail
          cat assets/fall-video/part*.txt | tr -d '\r\n\t ' | base64 --decode > assets/final-video.mp4
          test "$(dd if=assets/final-video.mp4 bs=1 skip=4 count=4 2>/dev/null)" = "ftyp"
          test -s assets/final-video.mp4
          ls -lh assets/final-video.mp4

      - name: Commit rebuilt video
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/final-video.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Build final birthday MP4"
          git push
