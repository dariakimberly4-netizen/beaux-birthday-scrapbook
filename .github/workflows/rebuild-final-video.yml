name: Rebuild final birthday video

on:
  push:
    paths:
      - '.github/workflows/rebuild-final-video.yml'

permissions:
  contents: write

jobs:
  rebuild-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and validate MP4
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, subprocess, itertools

          files = sorted(Path('assets/fall-video').glob('part*.txt'))
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          chunks=[]
          for path in files:
              s=re.sub(r'\s+','',path.read_text(encoding='utf-8',errors='ignore'))
              s=''.join(c for c in s if c in alphabet)
              chunks.append(s)
              print(path.name, len(s))

          odd=[i for i,c in enumerate(chunks) if i != len(chunks)-1 and len(c)%4]
          print('Odd-length chunks:', odd)
          if odd != [10,15]:
              raise SystemExit(f'Unexpected malformed chunks: {odd}')

          candidates=[]
          for cut10,cut15 in itertools.product(('first','last'), repeat=2):
              cc=chunks.copy()
              for idx,where in ((10,cut10),(15,cut15)):
                  cc[idx]=cc[idx][1:] if where=='first' else cc[idx][:-1]
              joined=''.join(cc)
              if len(joined)%4:
                  continue
              try:
                  data=base64.b64decode(joined, validate=True)
              except Exception as e:
                  print('decode failed',cut10,cut15,e)
                  continue
              if len(data)<12 or data[4:8] != b'ftyp':
                  continue
              p=Path(f'/tmp/candidate-{cut10}-{cut15}.mp4')
              p.write_bytes(data)
              proc=subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','null','-'],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              err=proc.stderr.decode('utf-8','ignore')
              score=len(err)+(0 if proc.returncode==0 else 1000000)
              print(f'candidate {cut10}/{cut15}: bytes={len(data)} return={proc.returncode} error_chars={len(err)}')
              if err:
                  print(err[:1200])
              candidates.append((score,cut10,cut15,data,err))

          if not candidates:
              raise SystemExit('No decodable repair candidates')
          candidates.sort(key=lambda x:x[0])
          score,cut10,cut15,data,err=candidates[0]
          print(f'Chosen repair: part10={cut10}, part15={cut15}, score={score}')
          out=Path('assets/final-video.mp4')
          out.write_bytes(data)
          print(f'Wrote {out} ({len(data)} bytes); moov={b"moov" in data}; mdat={b"mdat" in data}')
          PY
          test -s assets/final-video.mp4
          file assets/final-video.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/final-video.mp4

      - name: Commit rebuilt video
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/final-video.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Build final birthday MP4"
          git push
