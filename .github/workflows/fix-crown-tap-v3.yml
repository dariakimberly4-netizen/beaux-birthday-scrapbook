name: Fix crown tap v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-crown-tap-v3.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make crown itself the touch target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crown-100-fixed.html')
          s=p.read_text()
          s=s.replace('.crownTap{position:absolute;inset:0;z-index:25;width:100%;height:100%;border:0;background:transparent;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}', '.crownTap{position:absolute;inset:0;z-index:25;width:100%;height:100%;border:0;background:transparent;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:none}')
          s=s.replace('<section class="crown" id="crown">', '<section class="crown" id="crown" role="button" tabindex="0" aria-label="Restore next crown piece">')
          old="restore.addEventListener('click',e=>{e.stopPropagation();activate()});crownTap.addEventListener('click',crownTapMemory);closeMemory.onclick=continueBtn.onclick=closeMem;"
          new="restore.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();activate()});\nlet crownLastTap=0;\nfunction handleCrownDirect(e){const now=Date.now();if(now-crownLastTap<450)return;crownLastTap=now;if(e.cancelable)e.preventDefault();if(progress>=100&&(!Number.isFinite(e.clientX)||!Number.isFinite(e.clientY))){activate();return}crownTapMemory(e)}\ncrown.addEventListener('pointerup',handleCrownDirect,{passive:false});\ncrown.addEventListener('click',e=>{if(e.detail===0)handleCrownDirect(e)});\ncrown.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handleCrownDirect(e)}});\ncloseMemory.onclick=continueBtn.onclick=closeMem;"
          if old not in s:
              raise SystemExit('Expected crown listener block not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crown-100-fixed.html
          git diff --cached --quiet || git commit -m "Make crown directly tappable on mobile"
          git push
