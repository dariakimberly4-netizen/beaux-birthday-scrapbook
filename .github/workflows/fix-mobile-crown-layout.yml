name: Fix mobile crown layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-crown-layout.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fit crown experience inside mobile viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crown-100-fixed.html')
          s=p.read_text()
          marker='/* MOBILE_VIEWPORT_REPAIR_V1 */'
          if marker not in s:
              css=r'''
/* MOBILE_VIEWPORT_REPAIR_V1 */
html,body{height:100dvh;min-height:100dvh;max-height:100dvh}
.stage{height:100dvh;min-height:100dvh;max-height:100dvh}
@media(max-width:760px){
  .top{top:max(8px,env(safe-area-inset-top));left:12px;right:12px}
  .brand{font-size:8px;letter-spacing:.18em}
  .count{font-size:12px}
  .bar{top:36px;width:76vw}
  .copy{top:52px;width:94vw;max-width:94vw}
  .copy small{font-size:7.5px;letter-spacing:.22em;margin-bottom:6px;white-space:normal}
  .copy h1{font-size:clamp(27px,8.2vw,37px);line-height:.92}
  .copy p{font-size:11.5px;line-height:1.32;max-width:90vw;margin:8px auto 0;padding:0 4px}
  .crown{top:50%;width:94vw;height:37dvh;min-height:220px;max-height:355px}
  .ghost{inset:0 2% 4%;width:96%;height:94%;opacity:.34}
  .piece{opacity:.23}
  .controls{bottom:max(10px,env(safe-area-inset-bottom));width:94vw}
  .restore{width:min(390px,90vw);min-height:56px;font-size:11px}
  .hint{margin-top:6px}
  .reset{margin-top:3px;min-height:26px}
}
@media(max-width:760px) and (max-height:720px){
  .copy{top:48px}
  .copy p{font-size:10.5px;line-height:1.25}
  .crown{top:49%;height:34dvh;min-height:190px}
  .restore{min-height:50px}
  .hint{display:none}
}
'''
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crown-100-fixed.html
          git diff --cached --quiet || git commit -m "Fit crown experience to mobile viewport"
          git push